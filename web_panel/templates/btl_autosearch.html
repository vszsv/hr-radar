<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Radar — Автопоиски BTL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="btlAutosearchApp()">

  {% include 'nav.html' %}

  <div class="bg-white border-b">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <h2 class="text-base font-semibold text-gray-700">📦 Автопоиски — BTL агентства</h2>
      <span class="text-xs text-gray-400" x-text="companies.filter(c=>c.enabled).length + '/' + companies.length + ' вкл.'"></span>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-4 py-6 space-y-6">

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white rounded-xl shadow-sm p-4 text-center">
        <div class="text-2xl font-bold text-blue-600" x-text="companies.length">0</div>
        <div class="text-xs text-gray-500">Компаний</div>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-4 text-center">
        <div class="text-2xl font-bold text-green-600" x-text="companies.filter(c=>c.enabled).length">0</div>
        <div class="text-xs text-gray-500">Включено</div>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-4 text-center">
        <div class="text-2xl font-bold text-purple-600" x-text="totalResumes">0</div>
        <div class="text-xs text-gray-500">Резюме найдено</div>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-4 text-center">
        <div class="text-2xl font-bold text-orange-600" x-text="scoredCount">—</div>
        <div class="text-xs text-gray-500">Оценено</div>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm p-4 flex flex-wrap items-center gap-3">
      <button @click="checkAllCounts()" :disabled="checking" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 disabled:opacity-50 transition-colors">
        <span x-show="!checking">🔍 Проверить все</span>
        <span x-show="checking" x-text="'⏳ Проверяю... '+checkProgress+'/'+companies.filter(c=>c.enabled).length"></span>
      </button>
      <button @click="runSearch()" :disabled="running" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm font-medium hover:bg-green-700 disabled:opacity-50 transition-colors">
        <span x-show="!running">🚀 Запустить поиск + скоринг</span>
        <span x-show="running">⏳ Идёт поиск...</span>
      </button>
      <button @click="toggleAll()" class="px-3 py-2 bg-gray-100 text-gray-600 rounded-lg text-xs font-medium hover:bg-gray-200 transition-colors">
        ⚡ Вкл/выкл все
      </button>
      <div class="ml-auto">
        <input x-model="search" type="text" placeholder="🔍 Поиск..." class="border rounded-lg px-3 py-2 text-sm w-48 focus:outline-none focus:ring-2 focus:ring-blue-300">
      </div>
    </div>

    <div x-show="running" class="bg-blue-50 rounded-xl p-4">
      <div class="flex items-center gap-2 mb-2">
        <div class="animate-spin h-4 w-4 border-2 border-blue-600 border-t-transparent rounded-full"></div>
        <span class="text-sm font-medium text-blue-800" x-text="runStatus"></span>
      </div>
      <div class="bg-blue-200 rounded-full h-2">
        <div class="bg-blue-600 rounded-full h-2 transition-all" :style="'width:'+runProgress+'%'"></div>
      </div>
      <div class="mt-2 text-xs text-blue-600 max-h-32 overflow-y-auto" x-html="runLog"></div>
    </div>

    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-gray-600 text-xs uppercase">
          <tr>
            <th class="px-3 py-2 text-left w-8">Вкл</th>
            <th class="px-3 py-2 text-left">Компания</th>
            <th class="px-3 py-2 text-center">Всего</th>
            <th class="px-3 py-2 text-center">За 24ч</th>
            <th class="px-3 py-2 text-center">Статус</th>
            <th class="px-3 py-2 text-center">Действия</th>
          </tr>
        </thead>
        <tbody class="divide-y">
          <template x-for="(comp, idx) in filteredCompanies" :key="comp._idx">
            <tr :class="comp.enabled ? 'bg-white' : 'bg-gray-50 opacity-60'" class="cursor-pointer hover:bg-blue-50/50" @click="previewCompany(comp._idx)">
              <td class="px-3 py-2" @click.stop>
                <input type="checkbox" :checked="comp.enabled" @change="toggleOne(comp._idx)" class="rounded">
              </td>
              <td class="px-3 py-2">
                <div class="font-medium text-gray-800" x-text="comp.name"></div>
                <div class="text-xs text-gray-400 truncate max-w-xs" x-text="comp.hh_key?.substring(0,60)+'...'"></div>
              </td>
              <td class="px-3 py-2 text-center">
                <span x-show="comp.last_count !== null && comp.last_count !== undefined" class="font-mono font-medium"
                      :class="comp.last_count > 1000 ? 'text-red-600' : comp.last_count > 500 ? 'text-yellow-600' : comp.last_count > 0 ? 'text-green-600' : 'text-gray-400'"
                      x-text="comp.last_count"></span>
                <span x-show="comp.last_count === null || comp.last_count === undefined" class="text-gray-300">—</span>
              </td>
              <td class="px-3 py-2 text-center">
                <span x-show="comp.count_24h !== null && comp.count_24h !== undefined && comp.count_24h > 0" class="font-mono font-bold text-blue-600" x-text="comp.count_24h"></span>
                <span x-show="comp.count_24h === 0" class="text-gray-300">0</span>
                <span x-show="comp.count_24h === null || comp.count_24h === undefined" class="text-gray-300">—</span>
              </td>
              <td class="px-3 py-2 text-center">
                <span x-show="comp.checking" class="animate-spin inline-block">⏳</span>
                <span x-show="!comp.checking && comp.last_count > 1000" class="text-red-500 text-xs">🔴 шумно</span>
                <span x-show="!comp.checking && comp.last_count !== null && comp.last_count <= 1000 && comp.last_count > 500" class="text-yellow-500 text-xs">🟡 много</span>
                <span x-show="!comp.checking && comp.last_count !== null && comp.last_count <= 500 && comp.last_count > 10" class="text-green-500 text-xs">🟢 ок</span>
                <span x-show="!comp.checking && comp.last_count !== null && comp.last_count <= 10 && comp.last_count > 0" class="text-blue-500 text-xs">🔵 мало</span>
                <span x-show="!comp.checking && comp.last_count === 0" class="text-gray-400 text-xs">⚪ пусто</span>
              </td>
              <td class="px-3 py-2 text-center" @click.stop>
                <div class="flex gap-1 justify-center">
                  <button @click="checkOne(comp._idx)" :disabled="comp.checking" class="px-2 py-1 bg-blue-50 text-blue-600 rounded text-xs hover:bg-blue-100 disabled:opacity-50">🔍</button>
                </div>
              </td>
            </tr>
          </template>
        </tbody>
        <tfoot class="bg-gray-100 border-t-2 border-gray-300">
          <tr class="font-semibold text-gray-700">
            <td class="px-3 py-3"></td>
            <td class="px-3 py-3">Итого</td>
            <td class="px-3 py-3 text-center font-mono" x-text="companies.reduce((s,c) => s + (c.last_count || 0), 0)"></td>
            <td class="px-3 py-3 text-center font-mono text-blue-600" x-text="companies.reduce((s,c) => s + (c.count_24h || 0), 0)"></td>
            <td class="px-3 py-3"></td>
            <td class="px-3 py-3"></td>
          </tr>
        </tfoot>
      </table>
    </div>

    <div x-show="previewIdx !== null" x-transition class="fixed inset-0 bg-black/30 flex items-center justify-center z-50" @click.self="previewIdx=null">
      <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-2xl mx-4 max-h-[80vh] overflow-y-auto">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-semibold text-gray-700" x-text="previewIdx !== null ? '👁 ' + companies[previewIdx]?.name + ' — обновлено за 24ч' : ''"></h3>
          <button @click="previewIdx=null" class="text-gray-400 hover:text-gray-600 text-xl">✕</button>
        </div>
        <div x-show="previewLoading" class="text-center py-8 text-gray-400">
          <div class="animate-spin inline-block h-6 w-6 border-2 border-blue-600 border-t-transparent rounded-full mb-2"></div>
          <div>Загрузка...</div>
        </div>
        <div x-show="!previewLoading && previewItems.length === 0" class="text-center py-8 text-gray-400">Нет обновлённых резюме за последние 24 часа</div>
        <div x-show="!previewLoading && previewItems.length > 0" class="space-y-3">
          <div class="text-xs text-gray-400 mb-2" x-text="'Найдено за 24ч: ' + previewTotal"></div>
          <template x-for="item in previewItems" :key="item.url">
            <a :href="item.url" target="_blank" class="block p-3 rounded-lg border hover:border-blue-300 hover:bg-blue-50/50 transition-colors">
              <div class="font-medium text-gray-800" x-text="item.title"></div>
              <div class="text-sm text-gray-500 mt-1">🏢 <span x-text="item.last_job"></span></div>
              <div class="flex gap-4 mt-1 text-xs text-gray-400">
                <span x-text="'💰 ' + item.salary"></span>
                <span x-text="'📍 ' + item.area"></span>
              </div>
            </a>
          </template>
        </div>
      </div>
    </div>
  </div>

<script>
function btlAutosearchApp() {
  const key = new URLSearchParams(window.location.search).get('key') || '';
  return {
    key, companies: [], checking: false, checkProgress: 0,
    running: false, runStatus: '', runProgress: 0, runLog: '',
    previewIdx: null, previewItems: [], previewTotal: 0, previewLoading: false,
    scoredCount: '—', search: '',

    get totalResumes() { return this.companies.reduce((s,c)=>s+(c.last_count||0),0); },
    get filteredCompanies() {
      const q = this.search.toLowerCase();
      return this.companies.map((c,i)=>({...c,_idx:i})).filter(c => !q || c.name.toLowerCase().includes(q));
    },

    async init() { await this.loadCompanies(); await this.loadStats(); },
    async loadCompanies() { const r=await fetch(`/api/autosearch/btl/companies?key=${this.key}`); if(r.ok) this.companies=await r.json(); },
    async loadStats() { const r=await fetch(`/api/autosearch/btl/stats?key=${this.key}`); if(r.ok){ const d=await r.json(); this.scoredCount=d.scored||'—'; } },

    async toggleOne(idx) {
      const r=await fetch(`/api/autosearch/btl/toggle?key=${this.key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idx})});
      if(r.ok){ const d=await r.json(); this.companies[idx].enabled=d.enabled; }
    },
    async checkOne(idx) {
      this.companies[idx].checking=true;
      const r=await fetch(`/api/autosearch/btl/check?key=${this.key}&idx=${idx}`);
      if(r.ok){ const d=await r.json(); this.companies[idx].last_count=d.count; this.companies[idx].count_24h=d.count_24h; }
      this.companies[idx].checking=false;
    },
    async checkAllCounts(){
      this.checking=true; this.checkProgress=0;
      for(let i=0;i<this.companies.length;i++){ if(!this.companies[i].enabled) continue; await this.checkOne(i); this.checkProgress++; await new Promise(r=>setTimeout(r,150)); }
      this.checking=false;
    },
    toggleAll(){ const all=this.companies.every(c=>c.enabled); this.companies.forEach(c=>c.enabled=!all); fetch(`/api/autosearch/btl/companies?key=${this.key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(this.companies)}); },

    async previewCompany(idx){
      this.previewIdx=idx; this.previewLoading=true; this.previewItems=[]; this.previewTotal=0;
      const r=await fetch(`/api/autosearch/btl/preview?key=${this.key}&idx=${idx}`);
      if(r.ok){ const d=await r.json(); this.previewItems=d.items||[]; this.previewTotal=d.total_24h||0; }
      this.previewLoading=false;
    },

    async runSearch(){
      if(!confirm('Запустить поиск и скоринг по BTL?')) return;
      this.running=true; this.runStatus='Запуск...'; this.runProgress=0; this.runLog='';
      const r=await fetch(`/api/autosearch/btl/run?key=${this.key}`,{method:'POST'});
      const data=await r.json();
      const es=new EventSource(`/api/autosearch/btl/run/${data.task_id}/stream?key=${this.key}`);
      es.onmessage=(e)=>{ const d=JSON.parse(e.data);
        if(d.stage==='progress'){ this.runStatus=d.message||'Идёт...'; this.runProgress=d.progress||0; this.runLog += `<div>${d.message}</div>`; }
        else if(d.stage==='done'){ this.runStatus='Готово!'; this.runProgress=100; this.running=false; this.loadStats(); es.close(); }
        else if(d.stage==='error'){ this.runStatus='Ошибка: '+d.message; this.running=false; es.close(); }
      };
      es.onerror=()=>{ this.running=false; es.close(); };
    },
  };
}
</script>
</body>
</html>
