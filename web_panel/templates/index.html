<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Radar</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>[x-cloak]{display:none!important}.tab-active{border-bottom:3px solid #3b82f6;color:#3b82f6;font-weight:600}</style>
</head>
<body class="bg-gray-50 min-h-screen" x-data="panel()" x-init="init()">

{% include 'nav.html' %}

<!-- Sub-tabs removed — navigation is now in the unified top nav -->

<main class="max-w-4xl mx-auto px-4 py-4">

<!-- ═══ DASHBOARD ═══ -->
<div x-show="tab==='dashboard'" x-cloak>
  <template x-for="stat in dashboard" :key="stat.id">
    <div class="bg-white rounded-xl shadow-sm p-4 mb-4">
      <h3 class="font-semibold text-gray-700 mb-3" x-text="stat.label"></h3>
      <div class="grid grid-cols-2 gap-3 mb-3">
        <div class="bg-blue-50 rounded-lg p-3 text-center">
          <div class="text-2xl font-bold text-blue-600" x-text="stat.today || 0"></div>
          <div class="text-xs text-gray-500">Сегодня</div>
        </div>
        <div class="bg-green-50 rounded-lg p-3 text-center">
          <div class="text-2xl font-bold text-green-600" x-text="stat.relevant_today || 0"></div>
          <div class="text-xs text-gray-500">Подходящих</div>
        </div>
        <div class="bg-gray-50 rounded-lg p-3 text-center">
          <div class="text-2xl font-bold text-gray-600" x-text="stat.total || 0"></div>
          <div class="text-xs text-gray-500">Всего <span class="text-gray-400" x-text="'(' + (stat.unique_total || 0) + ' уник.)'"></span></div>
        </div>
        <div class="bg-purple-50 rounded-lg p-3 text-center">
          <div class="text-2xl font-bold text-purple-600" x-text="stat.relevant || 0"></div>
          <div class="text-xs text-gray-500">Всего подходящих</div>
        </div>
      </div>
      <template x-if="stat.by_job?.length">
        <div class="space-y-1">
          <div class="text-xs text-gray-400 font-medium">По ролям (сегодня):</div>
          <template x-for="j in stat.by_job" :key="j.job">
            <div class="flex justify-between text-sm">
              <span class="text-gray-600" x-text="j.job"></span>
              <span><span class="text-blue-600 font-medium" x-text="j.total"></span> / <span class="text-green-600 font-medium" x-text="j.relevant"></span></span>
            </div>
          </template>
        </div>
      </template>
    </div>
  </template>
  <div x-show="!dashboard.length" class="text-center text-gray-400 py-8">Загрузка...</div>
</div>

<!-- ═══ SCREENING ═══ -->
<div x-show="tab==='screening'" x-cloak>

  <!-- ═══ AUTOFLOW RESULTS ═══ -->
  <div class="bg-white rounded-xl shadow-sm p-4 mb-6" x-show="afRuns.length > 0">
    <h2 class="text-lg font-bold text-gray-800 mb-3">📊 Результаты автоотбора</h2>
    <template x-for="run in afRuns" :key="run.profile + run.job">
      <div class="mb-4 border border-gray-200 rounded-lg overflow-hidden">
        <!-- Run header -->
        <div class="px-3 py-2 bg-gray-50 flex flex-wrap items-center gap-2 text-sm cursor-pointer"
             @click="run._open = !run._open">
          <span class="font-semibold text-gray-700" x-text="afLabel(run.profile)"></span>
          <span class="text-gray-400">→</span>
          <span class="font-medium" x-text="afJobLabel(run.job)"></span>
          <span class="text-xs text-gray-400 ml-auto" x-text="'📅 ' + run.date"></span>
          <span class="text-xs text-green-600" x-text="'✅' + run.approved"></span>
          <span class="text-xs text-yellow-600" x-text="'👁' + run.reviewed"></span>
          <span class="text-xs text-red-500" x-text="'❌' + run.rejected"></span>
          <span class="text-xs text-purple-600" x-text="'📤' + run.imported"></span>
          <svg class="w-4 h-4 text-gray-400 transition-transform" :class="run._open && 'rotate-180'" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </div>
        <!-- Candidates list -->
        <div x-show="run._open" x-transition class="divide-y divide-gray-100">
          <template x-for="c in (run.candidates || [])" :key="c.link">
            <div class="px-3 py-2 flex items-start gap-2 text-sm hover:bg-gray-50">
              <span class="flex-shrink-0 w-8 text-center font-bold rounded"
                :class="c.score >= 7 ? 'text-green-700 bg-green-100' : c.score >= 4 ? 'text-yellow-700 bg-yellow-100' : 'text-red-700 bg-red-100'"
                x-text="c.score + '/10'"></span>
              <div class="flex-1 min-w-0">
                <a :href="c.link" target="_blank" class="font-medium text-blue-600 hover:underline truncate block" x-text="c.name"></a>
                <div class="text-xs text-gray-500 line-clamp-2" x-text="c.reason"></div>
              </div>
              <span class="flex-shrink-0 text-xs px-2 py-0.5 rounded-full"
                :class="c.status === 'Одобрен ИИ' ? 'bg-green-100 text-green-700' : c.status === 'Просмотрен ИИ' ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700'"
                x-text="c.status"></span>
            </div>
          </template>
          <div x-show="!run.candidates || run.candidates.length === 0" class="px-3 py-2 text-xs text-gray-400">
            Детали кандидатов пока не сохранены (будут после следующего прогона)
          </div>
        </div>
      </div>
    </template>
  </div>

  <template x-for="p in profiles" :key="p.id">
    <div class="bg-white rounded-xl shadow-sm p-4 mb-4">
      <!-- Profile header -->
      <div class="flex items-center justify-between mb-3">
        <div>
          <h3 class="font-semibold text-gray-700" x-text="p.name"></h3>
          <div class="text-xs text-gray-400" x-text="p.email"></div>
        </div>
        <div class="flex gap-2">
          <button x-show="p.source==='hh_api'" @click="hhKeysOpen = hhKeysOpen === p.id ? null : p.id" class="px-3 py-1 rounded-full text-xs font-medium transition bg-purple-100 text-purple-700 hover:bg-purple-200">
            🔑 Ключи HH
          </button>
          <button @click="toggle(p.id, 'report_enabled')" class="px-3 py-1 rounded-full text-xs font-medium transition"
            :class="p.report_enabled ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-400'"
            x-text="p.report_enabled ? '📣 ON' : '🔕 OFF'"></button>
          <button @click="toggle(p.id, 'enabled')" class="px-3 py-1 rounded-full text-xs font-medium transition"
            :class="p.enabled ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-500'"
            x-text="p.enabled ? '✅ Вкл' : '❌ Выкл'"></button>
        </div>
      </div>

      <!-- HH Keys panel (outsource only) -->
      <div x-show="hhKeysOpen === p.id" x-transition class="mb-4 bg-purple-50 rounded-lg p-3 space-y-2">
        <div class="flex items-center justify-between">
          <h4 class="text-sm font-semibold text-purple-700">🔑 Компании для поиска HH</h4>
          <div class="flex gap-2">
            <button @click="hhCheckAll(p.id)" :disabled="hhChecking" class="px-2 py-1 bg-purple-200 text-purple-700 rounded text-xs hover:bg-purple-300 disabled:opacity-50">
              <span x-show="!hhChecking">🔍 Проверить</span>
              <span x-show="hhChecking">⏳...</span>
            </button>
          </div>
        </div>
        <div class="max-h-80 overflow-y-auto space-y-1">
          <template x-for="(comp, ci) in hhCompanies" :key="ci">
            <div class="flex items-center gap-2 text-xs bg-white rounded px-2 py-1.5">
              <input type="checkbox" x-model="comp.enabled" @change="hhSave()" class="rounded">
              <span x-show="(comp.last_count||0) > 1000" class="w-4 text-center">🔴</span>
              <span x-show="(comp.last_count||0) > 500 && (comp.last_count||0) <= 1000" class="w-4 text-center">🟡</span>
              <span x-show="(comp.last_count||0) > 10 && (comp.last_count||0) <= 500" class="w-4 text-center">🟢</span>
              <span x-show="(comp.last_count||0) > 0 && (comp.last_count||0) <= 10" class="w-4 text-center">🔵</span>
              <span x-show="comp.last_count === 0" class="w-4 text-center">⚪</span>
              <span x-show="comp.last_count == null" class="w-4 text-center text-gray-300">—</span>
              <div class="flex-1 min-w-0">
                <span class="font-medium" x-text="comp.name"></span>
                <span x-show="comp.directions" class="text-gray-400 ml-1" x-text="'· ' + (comp.directions||'').substring(0,40)"></span>
              </div>
              <span class="text-gray-400 hidden md:inline" x-text="comp.inn || ''"></span>
              <span class="w-14 text-right font-mono font-medium"
                :class="(comp.last_count||0) > 1000 ? 'text-red-600' : (comp.last_count||0) > 500 ? 'text-yellow-600' : (comp.last_count||0) > 0 ? 'text-green-600' : 'text-gray-300'"
                x-text="comp.last_count ?? '—'"></span>
            </div>
          </template>
        </div>
        <div class="text-xs text-purple-500" x-text="hhCompanies.filter(c=>c.enabled).length + ' из ' + hhCompanies.length + ' вкл. | ' + hhCompanies.reduce((s,c)=>s+(c.last_count||0),0) + ' резюме'"></div>
      </div>

      <!-- Jobs -->
      <div class="space-y-4">
        <template x-for="j in p.jobs" :key="j.slug">
          <div class="border border-gray-200 rounded-lg">
            <!-- Job header + toggle (click to collapse/expand) -->
            <div class="px-3 py-2 flex items-center justify-between cursor-pointer select-none"
              :class="j.autoflow?.enabled ? 'bg-emerald-50' : 'bg-gray-50'"
              @click="J(p.id,j.slug).open = !J(p.id,j.slug).open">
              <div class="flex items-center gap-1.5">
                <span class="text-[10px] text-gray-400 transition-transform" :class="J(p.id,j.slug).open ? 'rotate-90' : ''" x-text="'▶'"></span>
                <span class="text-sm font-medium" x-text="j.emoji + ' ' + j.name"></span>
                <span x-show="j.autoflow?.enabled" class="text-[9px] bg-emerald-500 text-white px-1.5 py-0.5 rounded-full font-bold">⚡AUTO</span>
                <!-- Compact autoflow last run badge (visible when collapsed) -->
                <template x-if="!J(p.id,j.slug).open && j.autoflow?.last_run">
                  <span class="text-[10px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded ml-1"
                    x-text="'🤖 ' + (j.autoflow.last_run.approved||0) + '✅ ' + (j.autoflow.last_run.imported||0) + '📤'"></span>
                </template>
              </div>
              <div class="flex gap-2 items-center" @click.stop>
                <button @click="toggle(p.id, j.slug)" class="px-2 py-0.5 rounded text-xs font-medium"
                  :class="j.enabled ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-500'"
                  x-text="j.enabled ? '✅' : '❌'"></button>
              </div>
            </div>

            <!-- ═══ ALWAYS VISIBLE: Направляющая + Autoflow toggle ═══ -->
            <div class="p-3 space-y-2">

              <!-- Направляющая (always visible) -->
              <div class="bg-blue-50 rounded-lg p-2.5 space-y-2">
                <div class="text-[11px] font-semibold text-blue-700 uppercase tracking-wide">⚙️ Направляющая</div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                  <div>
                    <div class="text-[10px] text-blue-600 mb-0.5">Промпт:</div>
                    <select @change="setRoutePrompt(p.id, j.slug, $event.target.value)" @click.stop class="w-full text-xs border border-blue-200 rounded px-2 py-1.5 bg-white">
                      <template x-for="pr in prompts" :key="pr.name">
                        <option :value="pr.name" :selected="getRoutePrompt(p.id, j.slug)===pr.name" x-text="pr.name"></option>
                      </template>
                    </select>
                  </div>
                  <div>
                    <div class="text-[10px] text-blue-600 mb-0.5">Вакансия FW:</div>
                    <select @change="setRoute(p.id+'.'+j.slug, $event.target.value)" @click.stop class="w-full text-xs border border-blue-200 rounded px-2 py-1.5 bg-white">
                      <option value="">— Нет —</option>
                      <template x-for="v in vacancies" :key="v.id">
                        <option :value="v.id" :selected="routes[p.id+'.'+j.slug]==v.id" x-text="v.name"></option>
                      </template>
                    </select>
                  </div>
                  <div>
                    <div class="text-[10px] text-blue-600 mb-0.5">Модель:</div>
                    <select x-model="selectedModel" @click.stop class="w-full text-xs border border-blue-200 rounded px-2 py-1.5 bg-white">
                      <template x-for="m in models" :key="m.id">
                        <option :value="m.id" x-text="m.name"></option>
                      </template>
                    </select>
                  </div>
                </div>
              </div>

              <!-- Autoflow last run (always visible if exists) -->
              <template x-if="j.autoflow?.enabled && j.autoflow?.last_run">
                <div class="bg-emerald-50 border border-emerald-200 rounded-lg p-2.5">
                  <div class="text-[11px] font-semibold text-emerald-700 mb-1">🤖 Последний автоflow</div>
                  <div class="flex gap-3 text-[11px] flex-wrap">
                    <span class="text-gray-600">📅 <span x-text="j.autoflow.last_run.date || '—'"></span></span>
                    <span class="text-blue-600">📋 <span x-text="j.autoflow.last_run.primary || 0"></span> первичных</span>
                    <span class="text-green-600">✅ <span x-text="j.autoflow.last_run.approved || 0"></span> одобрено</span>
                    <span class="text-yellow-600">👁 <span x-text="j.autoflow.last_run.reviewed || 0"></span> просмотрено</span>
                    <span class="text-red-600">❌ <span x-text="j.autoflow.last_run.rejected || 0"></span> отказ</span>
                    <span class="text-purple-600">📤 <span x-text="j.autoflow.last_run.imported || 0"></span> в FW</span>
                    <span class="text-gray-400">🔄 <span x-text="j.autoflow.last_run.dupes || 0"></span> дубл.</span>
                  </div>
                </div>
              </template>
            </div>

            <!-- ═══ EXPANDABLE: Autoflow settings + screening stages ═══ -->
            <div x-show="J(p.id,j.slug).open" x-cloak class="px-3 pb-3 space-y-3">

              <!-- ═══ AUTOFLOW ═══ -->
              <div class="rounded-lg p-2.5 space-y-2 transition-all"
                :class="j.autoflow?.enabled ? 'bg-emerald-50 border-2 border-emerald-400' : 'bg-gray-50 border border-gray-200'">
                <div class="flex items-center justify-between">
                  <div class="text-[11px] font-semibold uppercase tracking-wide flex items-center gap-1.5"
                    :class="j.autoflow?.enabled ? 'text-emerald-700' : 'text-gray-500'">
                    <span x-text="j.autoflow?.enabled ? '⚡' : '🔌'"></span>
                    Автоflow
                    <span x-show="j.autoflow?.enabled" class="text-[10px] bg-emerald-200 text-emerald-800 px-1.5 py-0.5 rounded-full font-bold animate-pulse">AUTO</span>
                  </div>
                  <button @click="toggleAutoflow(p.id, j.slug, 'enabled')"
                    class="px-3 py-1 rounded-full text-xs font-medium transition"
                    :class="j.autoflow?.enabled ? 'bg-emerald-500 text-white' : 'bg-gray-200 text-gray-500'"
                    x-text="j.autoflow?.enabled ? '⚡ ВКЛ' : '🔌 ВЫКЛ'"></button>
                </div>
                <!-- Autoflow details (shown when enabled) -->
                <div x-show="j.autoflow?.enabled" x-cloak class="space-y-2 pt-1">
                  <div class="flex flex-wrap gap-2 text-[11px]">
                    <label class="flex items-center gap-1 cursor-pointer">
                      <input type="checkbox" :checked="j.autoflow?.deep_scoring" @change="toggleAutoflow(p.id, j.slug, 'deep_scoring')" class="rounded">
                      <span>🤖 Глубокий скоринг</span>
                    </label>
                    <label class="flex items-center gap-1 cursor-pointer">
                      <input type="checkbox" :checked="j.autoflow?.fw_import_approved" @change="toggleAutoflow(p.id, j.slug, 'fw_import_approved')" class="rounded">
                      <span>✅ Импорт одобренных</span>
                    </label>
                    <label class="flex items-center gap-1 cursor-pointer">
                      <input type="checkbox" :checked="j.autoflow?.fw_import_reviewed" @change="toggleAutoflow(p.id, j.slug, 'fw_import_reviewed')" class="rounded">
                      <span>👁 Импорт просмотренных</span>
                    </label>
                    <label class="flex items-center gap-1 cursor-pointer">
                      <input type="checkbox" :checked="j.autoflow?.fw_import_rejected" @change="toggleAutoflow(p.id, j.slug, 'fw_import_rejected')" class="rounded">
                      <span>❌ Импорт отказов</span>
                    </label>
                  </div>
                  <!-- Per-job thresholds -->
                  <div class="flex gap-3 items-center">
                    <div class="flex items-center gap-1">
                      <span class="text-[10px] text-emerald-600">Одобрение ≥</span>
                      <input type="number" min="1" max="10" :value="j.autoflow?.thresholds?.approve || 7"
                        @change="setAutoflowThreshold(p.id, j.slug, 'approve', parseInt($event.target.value))"
                        class="w-12 text-xs border border-emerald-300 rounded px-1.5 py-0.5 text-center">
                    </div>
                    <div class="flex items-center gap-1">
                      <span class="text-[10px] text-emerald-600">Отказ &lt;</span>
                      <input type="number" min="1" max="10" :value="j.autoflow?.thresholds?.reject || 4"
                        @change="setAutoflowThreshold(p.id, j.slug, 'reject', parseInt($event.target.value))"
                        class="w-12 text-xs border border-emerald-300 rounded px-1.5 py-0.5 text-center">
                    </div>
                  </div>
                </div>
              </div>

              <!-- ═══ 🔄 РЕТРОСКОРИНГ ═══ -->
              <div class="bg-orange-50 border border-orange-200 rounded-lg p-2.5">
                <div class="flex items-center justify-between">
                  <div class="text-[11px] font-semibold text-orange-700 uppercase tracking-wide">🔄 Ретроскоринг</div>
                  <div class="flex items-center gap-2">
                    <span x-show="R(p.id,j.slug).running" class="text-[11px] text-orange-600 font-medium" x-text="R(p.id,j.slug).progress+'/'+R(p.id,j.slug).total"></span>
                    <button @click="startRetroscore(p.id, j.slug)"
                      :disabled="R(p.id,j.slug).running"
                      class="text-[11px] font-medium py-1 px-3 rounded-lg transition disabled:opacity-50"
                      :class="R(p.id,j.slug).running ? 'bg-orange-300 text-white' : 'bg-orange-500 text-white hover:bg-orange-600'">
                      <span x-text="R(p.id,j.slug).running ? '⏳ Скоринг...' : '🔄 Ретроскоринг'"></span>
                    </button>
                  </div>
                </div>
                <!-- Progress bar -->
                <div x-show="R(p.id,j.slug).running" class="mt-2">
                  <div class="w-full bg-orange-200 rounded-full h-1.5">
                    <div class="bg-orange-500 h-1.5 rounded-full transition-all" :style="'width:'+((R(p.id,j.slug).total>0?(R(p.id,j.slug).progress/R(p.id,j.slug).total*100):0))+'%'"></div>
                  </div>
                </div>
                <!-- Result message -->
                <div x-show="R(p.id,j.slug).status==='done'" class="mt-1.5 text-[11px] text-green-700 font-medium" x-text="R(p.id,j.slug).message"></div>
                <div x-show="R(p.id,j.slug).status==='error'" class="mt-1.5 text-[11px] text-red-600 font-medium" x-text="'❌ '+R(p.id,j.slug).message"></div>
                <div class="text-[10px] text-orange-500 mt-1">Оценивает всех прошлых кандидатов по этой роли</div>
              </div>

              <!-- ═══ 1. ПЕРВИЧНЫЙ ОТБОР ═══ -->
              <div x-init="loadPrimary(p.id, j.slug)">
                <div class="flex items-center justify-between mb-2">
                  <div class="text-xs font-bold text-gray-700">📋 1. Первичный отбор</div>
                  <template x-if="S(p.id,j.slug).dates?.length > 0">
                    <select @change="loadPrimary(p.id, j.slug, $event.target.value)" class="text-[11px] border rounded px-1.5 py-0.5">
                      <template x-for="d in S(p.id,j.slug).dates" :key="d">
                        <option :value="d" :selected="S(p.id,j.slug).currentDate===d" x-text="fmtDate(d)"></option>
                      </template>
                    </select>
                  </template>
                </div>

                <template x-if="S(p.id,j.slug).cands">
                  <div>
                    <div class="flex items-center gap-3 text-xs mb-2 flex-wrap">
                      <span class="bg-green-100 text-green-700 px-1.5 py-0.5 rounded font-medium">🎯 <span x-text="S(p.id,j.slug).cands.target"></span></span>
                      <span class="bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded font-medium">👤 <span x-text="S(p.id,j.slug).cands.near"></span></span>
                      <span class="text-gray-400" x-text="'из ' + S(p.id,j.slug).cands.total"></span>
                    </div>
                    <!-- Expand candidates -->
                    <template x-if="S(p.id,j.slug).cands.total > 0">
                      <div>
                        <button @click="S(p.id,j.slug).open = !S(p.id,j.slug).open"
                          class="text-[11px] text-blue-600 mb-1">
                          <span x-text="S(p.id,j.slug).open ? '▼ Скрыть' : '▶ Показать (' + S(p.id,j.slug).cands.relevant + ' отобранных)'"></span>
                        </button>
                        <div x-show="S(p.id,j.slug).open" x-cloak class="space-y-1.5">
                          <template x-for="(c, ci) in S(p.id,j.slug).cands.candidates.filter(x=>x.relevant)" :key="'c'+ci">
                            <div class="rounded-lg p-2 border mb-1" :class="c.fit_type==='target'?'bg-green-50 border-green-200':'bg-white border-gray-200'">
                              <div class="text-xs font-medium" :class="c.fit_type==='target'?'text-green-800':'text-gray-800'" x-text="(ci+1)+'. '+c.title"></div>
                              <div class="text-[11px] text-gray-500">🏢 <span x-text="c.last_job||'—'"></span> · 💰 <span x-text="c.salary||'—'"></span> · <span x-text="Math.round(c.confidence*100)+'%'"></span></div>
                              <div class="text-[10px] text-gray-400 italic" x-text="'💬 '+c.reason"></div>
                              <div class="text-[10px]">🔗 <a :href="c.link" target="_blank" class="text-blue-600 underline">HH</a></div>
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>
                <span x-show="S(p.id,j.slug).loading" class="text-xs text-gray-400">⏳</span>
              </div>

              <!-- ═══ 2. ВТОРИЧНЫЙ ОТБОР ═══ -->
              <div class="border-t border-gray-200 pt-3">
                <div class="text-xs font-bold text-gray-700 mb-2">🤖 2. Вторичный отбор (глубокий AI)</div>

                <div class="flex gap-2 items-center flex-wrap mb-2">
                  <button @click="startDeep(p.id, j.slug, 'target')" x-show="S(p.id,j.slug).cands?.target > 0"
                    :disabled="D(p.id,j.slug).running"
                    class="text-[11px] font-medium py-1.5 px-3 rounded-lg bg-green-600 text-white disabled:opacity-50">
                    🎯 Скорить <span x-text="S(p.id,j.slug).cands?.target||0"></span> точных
                  </button>
                  <button @click="startDeep(p.id, j.slug, 'near')" x-show="S(p.id,j.slug).cands?.near > 0"
                    :disabled="D(p.id,j.slug).running"
                    class="text-[11px] font-medium py-1.5 px-3 rounded-lg bg-blue-500 text-white disabled:opacity-50">
                    👤 Скорить <span x-text="S(p.id,j.slug).cands?.near||0"></span> подх.
                  </button>
                  <button @click="startDeep(p.id, j.slug, 'all')" x-show="S(p.id,j.slug).cands?.relevant > 0"
                    :disabled="D(p.id,j.slug).running"
                    class="text-[11px] font-medium py-1.5 px-3 rounded-lg bg-gray-600 text-white disabled:opacity-50">
                    📥 Все <span x-text="S(p.id,j.slug).cands?.relevant||0"></span>
                  </button>
                  <span x-show="D(p.id,j.slug).running" class="text-xs text-purple-600 font-medium" x-text="'⏳ '+D(p.id,j.slug).prog"></span>
                </div>

                <!-- Deep scoring results -->
                <template x-if="D(p.id,j.slug).results?.length">
                  <div>
                    <!-- Summary -->
                    <div class="flex gap-2 text-[11px] mb-2 flex-wrap">
                      <span class="bg-green-100 text-green-700 px-1.5 py-0.5 rounded">✅ <span x-text="D(p.id,j.slug).results.filter(r=>r.fw_status==='Одобрен ИИ').length"></span></span>
                      <span class="bg-yellow-100 text-yellow-700 px-1.5 py-0.5 rounded">👁 <span x-text="D(p.id,j.slug).results.filter(r=>r.fw_status==='Просмотрен ИИ').length"></span></span>
                      <span class="bg-red-100 text-red-700 px-1.5 py-0.5 rounded">❌ <span x-text="D(p.id,j.slug).results.filter(r=>r.fw_status==='Отказ ИИ').length"></span></span>
                    </div>
                    <!-- Filter -->
                    <div class="flex gap-1.5 mb-2 flex-wrap">
                      <button @click="D(p.id,j.slug).filter='all'" class="px-2 py-0.5 rounded-full text-[11px]"
                        :class="(D(p.id,j.slug).filter||'all')==='all'?'bg-gray-800 text-white':'bg-gray-100'">Все</button>
                      <button @click="D(p.id,j.slug).filter='approved'" class="px-2 py-0.5 rounded-full text-[11px]"
                        :class="D(p.id,j.slug).filter==='approved'?'bg-green-600 text-white':'bg-gray-100'">✅</button>
                      <button @click="D(p.id,j.slug).filter='reviewed'" class="px-2 py-0.5 rounded-full text-[11px]"
                        :class="D(p.id,j.slug).filter==='reviewed'?'bg-yellow-500 text-white':'bg-gray-100'">👁</button>
                      <button @click="D(p.id,j.slug).filter='rejected'" class="px-2 py-0.5 rounded-full text-[11px]"
                        :class="D(p.id,j.slug).filter==='rejected'?'bg-red-600 text-white':'bg-gray-100'">❌</button>
                    </div>
                    <!-- Cards -->
                    <div class="space-y-1.5">
                      <template x-for="(r, ri) in filterDeep(p.id, j.slug)" :key="ri">
                        <div class="border rounded-lg p-2" :class="r.fw_status==='Одобрен ИИ'?'border-green-200 bg-green-50':r.fw_status==='Отказ ИИ'?'border-red-200 bg-red-50':r.fw_status==='Просмотрен ИИ'?'border-yellow-200 bg-yellow-50':'border-gray-200'">
                          <div class="flex items-center justify-between">
                            <span class="font-medium text-xs" x-text="r.candidateName"></span>
                            <div class="flex items-center gap-1.5">
                              <span class="text-[10px] px-1.5 py-0.5 rounded-full font-medium"
                                :class="r.fw_status==='Одобрен ИИ'?'bg-green-200 text-green-800':r.fw_status==='Отказ ИИ'?'bg-red-200 text-red-800':r.fw_status==='Просмотрен ИИ'?'bg-yellow-200 text-yellow-800':'bg-gray-200'"
                                x-text="r.fw_status"></span>
                              <span class="text-sm font-bold" :class="r.score>=7?'text-green-600':r.score>=4?'text-yellow-600':'text-red-500'" x-text="r.score+'/10'"></span>
                            </div>
                          </div>
                          <p class="text-[10px] text-gray-500 mt-0.5" x-text="r.reason"></p>
                          <a :href="r.link" target="_blank" class="text-[10px] text-blue-500">🔗 HH</a>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
                <div x-show="!D(p.id,j.slug).results?.length && !D(p.id,j.slug).running" class="text-xs text-gray-400">
                  Запустите глубокий скоринг по кандидатам из первичного отбора
                </div>
              </div>

              <!-- ═══ 3. ИМПОРТ В FW ═══ -->
              <template x-if="D(p.id,j.slug).results?.length && !D(p.id,j.slug).running">
                <div class="border-t border-gray-200 pt-3">
                  <div class="text-xs font-bold text-gray-700 mb-2">📤 3. Импорт в FriendWork</div>

                  <template x-if="!routes[p.id+'.'+j.slug]">
                    <div class="text-xs text-red-500">⚠️ Привяжите вакансию FW в направляющей</div>
                  </template>
                  <template x-if="routes[p.id+'.'+j.slug]">
                    <div>
                      <div class="flex gap-1.5 flex-wrap mb-2">
                        <button @click="importScored(p.id, j.slug, 'approved')"
                          x-show="D(p.id,j.slug).results.filter(r=>r.fw_status==='Одобрен ИИ').length"
                          :disabled="D(p.id,j.slug).importing"
                          class="text-[11px] font-medium py-1.5 px-3 rounded-lg bg-green-600 text-white disabled:opacity-50">
                          ✅ Импорт <span x-text="D(p.id,j.slug).results.filter(r=>r.fw_status==='Одобрен ИИ').length"></span> одобренных
                        </button>
                        <button @click="importScored(p.id, j.slug, 'reviewed')"
                          x-show="D(p.id,j.slug).results.filter(r=>r.fw_status==='Просмотрен ИИ').length"
                          :disabled="D(p.id,j.slug).importing"
                          class="text-[11px] font-medium py-1.5 px-3 rounded-lg bg-yellow-500 text-white disabled:opacity-50">
                          👁 Импорт <span x-text="D(p.id,j.slug).results.filter(r=>r.fw_status==='Просмотрен ИИ').length"></span> просмотренных
                        </button>
                        <button @click="importScored(p.id, j.slug, 'rejected')"
                          x-show="D(p.id,j.slug).results.filter(r=>r.fw_status==='Отказ ИИ').length"
                          :disabled="D(p.id,j.slug).importing"
                          class="text-[11px] font-medium py-1.5 px-3 rounded-lg bg-red-500 text-white disabled:opacity-50">
                          ❌ Импорт <span x-text="D(p.id,j.slug).results.filter(r=>r.fw_status==='Отказ ИИ').length"></span> отказанных
                        </button>
                        <button @click="importScored(p.id, j.slug, 'all')"
                          :disabled="D(p.id,j.slug).importing"
                          class="text-[11px] font-medium py-1.5 px-3 rounded-lg bg-gray-600 text-white disabled:opacity-50">
                          📥 Все <span x-text="D(p.id,j.slug).results.length"></span>
                        </button>
                      </div>
                      <div x-show="D(p.id,j.slug).importing" class="text-xs text-gray-500">⏳ Импортирую...</div>
                      <!-- Import results -->
                      <template x-if="D(p.id,j.slug).importRes">
                        <div class="mt-2 space-y-1">
                          <div class="text-[11px] font-medium text-gray-600" x-text="D(p.id,j.slug).importSummary"></div>
                          <template x-for="(ir, ii) in D(p.id,j.slug).importRes" :key="ii">
                            <div class="text-[11px] py-0.5 flex flex-wrap items-center gap-1">
                              <span x-text="ir.ok ? '✅' : ir.candidate_id ? '🔄' : '⚠️'"></span>
                              <a x-show="ir.candidate_id" :href="'https://app.friend.work/Candidate/Profile/'+ir.candidate_id" target="_blank" class="text-blue-600 underline font-medium" x-text="'FW-'+ir.candidate_id"></a>
                              <span x-show="ir.fw_status" class="text-[10px] px-1 rounded" :class="ir.fw_status==='Одобрен ИИ'?'bg-green-100 text-green-700':ir.fw_status==='Просмотрен ИИ'?'bg-yellow-100 text-yellow-700':'bg-red-100 text-red-700'" x-text="ir.fw_status"></span>
                              <span x-show="ir.ok" class="text-green-600">новый</span>
                              <span x-show="!ir.ok && ir.candidate_id" class="text-gray-500">дубликат</span>
                              <span x-show="!ir.ok && !ir.candidate_id && ir.message" class="text-red-500" x-text="ir.message"></span>
                              <template x-if="ir.vacancies?.length">
                                <span class="text-[10px] text-purple-600 bg-purple-50 px-1 rounded" x-text="'📋 '+ir.vacancies.join(', ')"></span>
                              </template>
                            </div>
                          </template>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>
              </template>

            </div>
          </div>
        </template>
      </div>
    </div>
  </template>
</div>

<!-- ═══ SETTINGS ═══ -->
<div x-show="tab==='settings'" x-cloak>
  <div class="bg-white rounded-xl shadow-sm p-4 mb-4">
    <h3 class="font-semibold text-gray-700 mb-3">Модель и пороги</h3>
    <div class="space-y-3">
      <div>
        <label class="text-xs text-gray-500">Модель по умолчанию:</label>
        <select x-model="config.default_model" @change="saveConfig()" class="w-full border rounded-lg px-3 py-2 text-sm mt-1">
          <template x-for="m in models" :key="m.id">
            <option :value="m.id" x-text="m.name + ' — ' + m.price"></option>
          </template>
        </select>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs text-gray-500">Порог одобрения (≥)</label>
          <input type="number" x-model.number="config.score_threshold_approve" @change="saveConfig()" min="1" max="10" class="w-full border rounded-lg px-3 py-2 text-sm mt-1">
        </div>
        <div>
          <label class="text-xs text-gray-500">Порог отказа (&lt;)</label>
          <input type="number" x-model.number="config.score_threshold_reject" @change="saveConfig()" min="1" max="10" class="w-full border rounded-lg px-3 py-2 text-sm mt-1">
        </div>
      </div>
      <div class="text-xs text-gray-400 bg-gray-50 rounded p-2">
        ≥ <span x-text="config.score_threshold_approve"></span> → ✅ Одобрен ИИ · 
        <span x-text="config.score_threshold_reject"></span>–<span x-text="config.score_threshold_approve-1"></span> → 👁 Просмотрен ИИ ·
        &lt; <span x-text="config.score_threshold_reject"></span> → ❌ Отказ ИИ
      </div>
    </div>
  </div>
  <div class="bg-white rounded-xl shadow-sm p-4 mb-4">
    <h3 class="font-semibold text-gray-700 mb-3">⏰ Расписание запуска</h3>
    <div class="space-y-2">
      <div class="flex items-center gap-3">
        <label class="text-xs text-gray-500">Время запуска (МСК):</label>
        <input type="time" x-model="config.schedule_time_msk" @change="saveSchedule()"
          class="border rounded-lg px-3 py-2 text-sm">
      </div>
      <div class="text-xs text-gray-400">
        Сейчас: <span x-text="config.schedule_time_msk || '10:00'" class="font-medium"></span> МСК ·
        Первичный отбор + автоflow (если включён) запускаются последовательно
      </div>
    </div>
  </div>
  <div class="bg-white rounded-xl shadow-sm p-4 mb-4">
    <h3 class="font-semibold text-gray-700 mb-3">Промпты</h3>
    <div class="flex gap-2 mb-2 flex-wrap">
      <template x-for="pr in prompts" :key="pr.name">
        <button @click="loadPrompt(pr.name)" class="px-3 py-1 rounded-full text-xs font-medium"
          :class="currentPrompt===pr.name?'bg-blue-600 text-white':'bg-gray-100 text-gray-600'"
          x-text="pr.name"></button>
      </template>
    </div>
    <textarea x-model="promptText" class="w-full border rounded-lg px-3 py-2 text-xs font-mono h-48 resize-y"></textarea>
    <div class="flex gap-2 mt-2">
      <button @click="savePrompt()" class="px-4 py-1.5 bg-blue-600 text-white rounded-lg text-sm">💾 Сохранить</button>
      <button @click="newPrompt()" class="px-4 py-1.5 bg-gray-200 text-gray-700 rounded-lg text-sm">➕ Новый</button>
    </div>
  </div>
</div>

</main>

<script>
function panel() {
  const KEY = new URLSearchParams(location.search).get('key') || '';
  const BASE = location.pathname.replace(/\/$/, '');
  const API = (p) => BASE + p + (p.includes('?') ? '&' : '?') + 'key=' + KEY;

  return {
    tab: new URLSearchParams(location.search).get('tab') || 'dashboard', lastUpdate: '',
    dashboard: [], profiles: [], vacancies: [], routes: [], afRuns: [],
    selectedModel: 'gpt-5.2', models: [],
    config: {}, prompts: [], currentPrompt: '', promptText: '',
    // State per job
    _primary: {},  // primary screening state
    _deep: {},     // deep scoring state

    _jobs: {},  // job collapse state
    _retro: {},  // retroscoring state
    hhKeysOpen: null,  // which profile's HH keys panel is open
    hhCompanies: [],
    hhChecking: false,
    afLabel(p) { return {event_agencies:'🎪 Event',btl_agencies:'📦 BTL',outsource_agencies:'🏢 Аутсорсинг'}[p]||p; },
    afJobLabel(j) { return {account_director:'Account Director',account_manager:'Account Manager',project_manager:'Project Manager',new_business:'New Business',outsource_manager:'Руководитель'}[j]||j; },
    J(pid, slug) { const k=pid+'.'+slug; if(!this._jobs[k]) this._jobs[k]={open:false}; return this._jobs[k]; },
    S(pid, slug) { const k=pid+'.'+slug; if(!this._primary[k]) this._primary[k]={cands:null,loading:false,open:false,dates:[],currentDate:''}; return this._primary[k]; },
    D(pid, slug) { const k=pid+'.'+slug; if(!this._deep[k]) this._deep[k]={results:null,running:false,prog:'',filter:'all',importing:false,importRes:null,importSummary:''}; return this._deep[k]; },
    R(pid, slug) { const k=pid+'.'+slug; if(!this._retro[k]) this._retro[k]={running:false,progress:0,total:0,relevant:0,status:'idle',message:''}; return this._retro[k]; },

    async init() {
      this.lastUpdate = new Date().toLocaleTimeString('ru-RU');
      const [dash,ctrl,vacs,cfg,mdls,prm,rts] = await Promise.allSettled([
        fetch(API('/api/dashboard')).then(r=>r.json()),
        fetch(API('/api/controls')).then(r=>r.json()),
        fetch(API('/api/vacancies')).then(r=>r.json()),
        fetch(API('/api/config')).then(r=>r.json()),
        fetch(API('/api/models')).then(r=>r.json()),
        fetch(API('/api/prompts')).then(r=>r.json()),
        fetch(API('/api/routes')).then(r=>r.json()),
      ]);
      if(dash.status==='fulfilled') this.dashboard=dash.value.stats||[];
      if(ctrl.status==='fulfilled') this.profiles=ctrl.value.profiles||[];
      if(vacs.status==='fulfilled') this.vacancies=vacs.value.vacancies||[];
      if(cfg.status==='fulfilled'){this.config=cfg.value; this.selectedModel=cfg.value.default_model||'gpt-5.2';}
      if(mdls.status==='fulfilled') this.models=mdls.value.models||[];
      if(prm.status==='fulfilled') this.prompts=prm.value.prompts||[];
      if(rts.status==='fulfilled') this.routes=rts.value.routes||{};
      // Load HH companies for outsource
      try { this.hhCompanies = await fetch(API('/api/outsource/companies')).then(r=>r.ok?r.json():[]); } catch(e) { this.hhCompanies=[]; }
      // Load autoflow results
      try { const af = await fetch(API('/api/autoflow-results')).then(r=>r.ok?r.json():{}); this.afRuns=(af.runs||[]).map(r=>({...r,_open:false})); } catch(e) { this.afRuns=[]; }
    },

    fmtDate(d) {
      if(!d) return '';
      const t=new Date().toISOString().slice(0,10);
      const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
      return d===t?'Сегодня':d===y?'Вчера':d.slice(5);
    },

    getRoutePrompt(pid,slug) { return (this.config.route_prompts||{})[pid+'.'+slug] || this.prompts[0]?.name || 'default_am'; },

    async setRoutePrompt(pid,slug,val) {
      if(!this.config.route_prompts) this.config.route_prompts={};
      this.config.route_prompts[pid+'.'+slug]=val;
      await fetch(API('/api/config'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(this.config)});
    },

    async toggle(pid,field) {
      await fetch(API('/api/controls/toggle'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profile:pid,field})});
      const d=await fetch(API('/api/controls')).then(r=>r.json());
      this.profiles=d.profiles||[];
    },

    async setRoute(key,val) {
      this.routes[key]=val?parseInt(val):null;
      await fetch(API('/api/routes'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({routes:this.routes})});
    },

    async loadPrimary(pid,slug,date) {
      const s=this.S(pid,slug);
      s.loading=true;
      const dp=date?'&date='+date:'';
      try {
        const d=await fetch(API('/api/today/'+pid+'/'+slug)+dp).then(r=>r.json());
        s.cands=d; s.dates=d.dates||[]; s.currentDate=d.date||'';
        // If today has no data but older dates exist, auto-load the latest
        if(!date && d.total===0 && d.dates?.length>0) {
          return this.loadPrimary(pid,slug,d.dates[0]);
        }
      } catch(e){console.error(e);}
      s.loading=false;
    },

    async startDeep(pid,slug,filter) {
      const k=pid+'.'+slug;
      const s=this.S(pid,slug);
      const d=this.D(pid,slug);
      if(!s.cands) return;
      let cands=s.cands.candidates.filter(c=>c.relevant);
      if(filter==='target') cands=cands.filter(c=>c.fit_type==='target');
      else if(filter==='near') cands=cands.filter(c=>c.fit_type!=='target');
      const links=cands.map(c=>c.link);
      if(!links.length) return;

      d.running=true; d.prog='0/'+links.length; d.results=[]; d.filter='all'; d.importRes=null;
      const prompt=this.getRoutePrompt(pid,slug);

      // Get per-job thresholds if available
      const prof = this.profiles.find(p2=>p2.id===pid);
      const jobData = prof?.jobs?.find(j2=>j2.slug===slug);
      const thresholds = jobData?.autoflow?.thresholds || null;

      await fetch(API('/api/deep-scoring/start'),{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({job_key:k, links, model:this.selectedModel, prompt, thresholds})
      });

      const es=new EventSource(API('/api/deep-scoring/'+k+'/stream'));
      es.addEventListener('update',(e)=>{
        const data=JSON.parse(e.data);
        d.prog=(data.progress||0)+'/'+(data.total||0);
        if(data.results) d.results=data.results;
        if(data.status==='done'||data.status==='error'){d.running=false; es.close();}
      });
    },

    filterDeep(pid,slug) {
      const d=this.D(pid,slug);
      const f=d.filter||'all', res=d.results||[];
      if(f==='approved') return res.filter(r=>r.fw_status==='Одобрен ИИ');
      if(f==='reviewed') return res.filter(r=>r.fw_status==='Просмотрен ИИ');
      if(f==='rejected') return res.filter(r=>r.fw_status==='Отказ ИИ');
      return res;
    },

    async importScored(pid,slug,filter) {
      const k=pid+'.'+slug;
      const d=this.D(pid,slug);
      const vacId=this.routes[k];
      if(!vacId||!d.results?.length) return;

      let cands=d.results;
      if(filter==='approved') cands=cands.filter(r=>r.fw_status==='Одобрен ИИ');
      else if(filter==='reviewed') cands=cands.filter(r=>r.fw_status==='Просмотрен ИИ');
      else if(filter==='rejected') cands=cands.filter(r=>r.fw_status==='Отказ ИИ');

      d.importing=true; d.importRes=null;
      try {
        const r=await fetch(API('/api/import-scored'),{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({vacancy_id:parseInt(vacId), candidates:cands, model:this.selectedModel})
        });
        const data=await r.json();
        d.importRes=data.results||[];
        d.importSummary=`✅ ${data.imported} новых · 🔄 ${data.duplicates} дубл. · ${data.total} всего`;
      } catch(e) {
        d.importRes=[{ok:false,message:e.message}];
        d.importSummary='❌ Ошибка';
      }
      d.importing=false;
    },

    async toggleAutoflow(pid, slug, field) {
      const r = await fetch(API('/api/autoflow/'+pid+'/'+slug+'/toggle'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({field})});
      const data = await r.json();
      // Update local state
      const prof = this.profiles.find(p=>p.id===pid);
      if(prof) {
        const job = prof.jobs.find(j=>j.slug===slug);
        if(job) job.autoflow = {...(job.autoflow||{}), ...data.autoflow};
      }
    },

    async setAutoflowThreshold(pid, slug, field, value) {
      const thresholds = {};
      thresholds[field] = value;
      await fetch(API('/api/autoflow/'+pid+'/'+slug),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({thresholds})});
      // Update local state
      const prof = this.profiles.find(p=>p.id===pid);
      if(prof) {
        const job = prof.jobs.find(j=>j.slug===slug);
        if(job && job.autoflow) {
          if(!job.autoflow.thresholds) job.autoflow.thresholds={};
          job.autoflow.thresholds[field] = value;
        }
      }
    },

    async startRetroscore(pid, slug) {
      const r = this.R(pid, slug);
      if(r.running) return;
      r.running=true; r.progress=0; r.total=0; r.relevant=0; r.status='running'; r.message='Запуск...';
      try {
        await fetch(API('/api/retroscore/'+pid+'/'+slug),{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({model:this.selectedModel, batch_size:15})
        });
        const es=new EventSource(API('/api/retroscore/'+pid+'/'+slug+'/stream'));
        es.addEventListener('update',(e)=>{
          const data=JSON.parse(e.data);
          r.progress=data.progress||0;
          r.total=data.total||0;
          r.relevant=data.relevant||0;
          r.status=data.status||'running';
          r.message=data.message||((data.progress||0)+'/'+(data.total||0));
          if(data.status==='done'||data.status==='error'){
            r.running=false;
            es.close();
            if(data.status==='done') this.loadPrimary(pid,slug);
          }
        });
      } catch(e) {
        r.running=false; r.status='error'; r.message=e.message;
      }
    },

    async saveSchedule() {
      await this.saveConfig();
      // Update systemd timer via API
      await fetch(API('/api/schedule'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({time_msk:this.config.schedule_time_msk})});
    },
    async saveConfig() { await fetch(API('/api/config'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(this.config)}); },
    async loadPrompt(name) { this.currentPrompt=name; const d=await fetch(API('/api/prompt/'+name)).then(r=>r.json()); this.promptText=d.content||''; },
    async savePrompt() { if(!this.currentPrompt) return; await fetch(API('/api/prompt/'+this.currentPrompt),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:this.promptText})}); alert('Сохранено!'); },
    async newPrompt() {
      const name=prompt('Имя промпта (латиница):');
      if(!name||!/^[a-z0-9_-]+$/i.test(name)) return;
      this.currentPrompt=name; this.promptText='';
      await fetch(API('/api/prompt/'+name),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:''})});
      const prm=await fetch(API('/api/prompts')).then(r=>r.json()); this.prompts=prm.prompts||[];
    },

    // HH Keys management
    async hhSave() {
      await fetch(API('/api/outsource/companies'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(this.hhCompanies)});
    },
    async hhCheckAll() {
      this.hhChecking = true;
      for (let i = 0; i < this.hhCompanies.length; i++) {
        if (!this.hhCompanies[i].enabled) continue;
        try {
          const r = await fetch(API('/api/outsource/check?idx='+i));
          if (r.ok) { const d = await r.json(); this.hhCompanies[i].last_count = d.count; }
        } catch(e) {}
        await new Promise(r=>setTimeout(r,200));
      }
      this.hhChecking = false;
      await this.hhSave();
    },
  }
}
</script>
