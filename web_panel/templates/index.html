<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Radar</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>[x-cloak]{display:none!important}.tab-active{border-bottom:3px solid #3b82f6;color:#3b82f6;font-weight:600}</style>
</head>
<body class="bg-gray-50 min-h-screen" x-data="panel()" x-init="init()">

<!-- Header -->
<header class="bg-white shadow-sm sticky top-0 z-50">
  <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
    <h1 class="text-lg font-bold text-gray-800">🎯 HR Radar</h1>
    <span class="text-xs text-gray-400" x-text="lastUpdate"></span>
  </div>
  <div class="max-w-4xl mx-auto px-4 flex gap-4 overflow-x-auto text-sm border-b">
    <button @click="tab='dashboard'" :class="tab==='dashboard'?'tab-active':'text-gray-500'" class="pb-2 whitespace-nowrap">📊 Дашборд</button>
    <button @click="tab='screening'" :class="tab==='screening'?'tab-active':'text-gray-500'" class="pb-2 whitespace-nowrap">🔍 Отбор</button>
    <button @click="tab='settings'" :class="tab==='settings'?'tab-active':'text-gray-500'" class="pb-2 whitespace-nowrap">🔧 Настройки</button>
  </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-4">

<!-- ═══ DASHBOARD ═══ -->
<div x-show="tab==='dashboard'" x-cloak>
  <template x-for="stat in dashboard" :key="stat.id">
    <div class="bg-white rounded-xl shadow-sm p-4 mb-4">
      <h3 class="font-semibold text-gray-700 mb-3" x-text="stat.label"></h3>
      <div class="grid grid-cols-2 gap-3 mb-3">
        <div class="bg-blue-50 rounded-lg p-3 text-center">
          <div class="text-2xl font-bold text-blue-600" x-text="stat.today || 0"></div>
          <div class="text-xs text-gray-500">Сегодня</div>
        </div>
        <div class="bg-green-50 rounded-lg p-3 text-center">
          <div class="text-2xl font-bold text-green-600" x-text="stat.relevant_today || 0"></div>
          <div class="text-xs text-gray-500">Подходящих</div>
        </div>
        <div class="bg-gray-50 rounded-lg p-3 text-center">
          <div class="text-2xl font-bold text-gray-600" x-text="stat.total || 0"></div>
          <div class="text-xs text-gray-500">Всего</div>
        </div>
        <div class="bg-purple-50 rounded-lg p-3 text-center">
          <div class="text-2xl font-bold text-purple-600" x-text="stat.relevant || 0"></div>
          <div class="text-xs text-gray-500">Всего подходящих</div>
        </div>
      </div>
      <template x-if="stat.by_job && stat.by_job.length">
        <div class="space-y-1">
          <div class="text-xs text-gray-400 font-medium">По ролям (сегодня):</div>
          <template x-for="j in stat.by_job" :key="j.job">
            <div class="flex justify-between text-sm">
              <span class="text-gray-600" x-text="j.job"></span>
              <span><span class="text-blue-600 font-medium" x-text="j.total"></span> / <span class="text-green-600 font-medium" x-text="j.relevant"></span></span>
            </div>
          </template>
        </div>
      </template>
      <div class="text-xs text-gray-400 mt-2" x-text="stat.last_run ? 'Последний прогон: ' + stat.last_run.slice(0,16).replace('T',' ') : ''"></div>
    </div>
  </template>
  <div x-show="!dashboard.length" class="text-center text-gray-400 py-8">Загрузка...</div>
</div>

<!-- ═══ UNIFIED SCREENING ═══ -->
<div x-show="tab==='screening'" x-cloak>
  
  <!-- Profile/On-Off controls -->
  <template x-for="p in profiles" :key="p.id">
    <div class="bg-white rounded-xl shadow-sm p-4 mb-4">
      <div class="flex items-center justify-between mb-3">
        <div>
          <h3 class="font-semibold text-gray-700" x-text="p.name"></h3>
          <div class="text-xs text-gray-400" x-text="p.email"></div>
        </div>
        <div class="flex gap-2">
          <button @click="toggle(p.id, 'report_enabled')" class="px-3 py-1 rounded-full text-xs font-medium transition"
            :class="p.report_enabled ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-400'"
            x-text="p.report_enabled ? '📣 Отчёт ON' : '🔕 Отчёт OFF'"></button>
          <button @click="toggle(p.id, 'enabled')" class="px-3 py-1 rounded-full text-xs font-medium transition"
            :class="p.enabled ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-500'"
            x-text="p.enabled ? '✅ Вкл' : '❌ Выкл'"></button>
        </div>
      </div>
      
      <!-- Jobs -->
      <div class="space-y-4">
        <template x-for="j in p.jobs" :key="j.slug">
          <div class="border border-gray-200 rounded-lg overflow-hidden">
            <!-- Job header -->
            <div class="bg-gray-50 px-3 py-2 flex items-center justify-between">
              <span class="text-sm font-medium" x-text="j.emoji + ' ' + j.name"></span>
              <button @click="toggle(p.id, j.slug)" class="px-2 py-0.5 rounded text-xs font-medium"
                :class="j.enabled ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-500'"
                x-text="j.enabled ? '✅' : '❌'"></button>
            </div>
            
            <div class="p-3 space-y-3">
              <!-- Направляющая: промпт + вакансия -->
              <div class="bg-blue-50 rounded-lg p-2.5 space-y-2">
                <div class="text-[11px] font-semibold text-blue-700 uppercase tracking-wide">Направляющая</div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  <div>
                    <div class="text-[10px] text-blue-600 mb-0.5">Системный промпт:</div>
                    <select @change="setRoutePrompt(p.id, j.slug, 'prompt', $event.target.value)" class="w-full text-xs border border-blue-200 rounded px-2 py-1.5 bg-white">
                      <template x-for="pr in prompts" :key="pr.name">
                        <option :value="pr.name" :selected="getRoutePrompt(p.id, j.slug)===pr.name" x-text="pr.name"></option>
                      </template>
                    </select>
                  </div>
                  <div>
                    <div class="text-[10px] text-blue-600 mb-0.5">Вакансия FriendWork:</div>
                    <select @change="setRoute(p.id + '.' + j.slug, $event.target.value)" class="w-full text-xs border border-blue-200 rounded px-2 py-1.5 bg-white">
                      <option value="">— Не привязана —</option>
                      <template x-for="v in vacancies" :key="v.id">
                        <option :value="v.id" :selected="routes[p.id + '.' + j.slug]==v.id" x-text="v.name"></option>
                      </template>
                    </select>
                  </div>
                </div>
              </div>
              
              <!-- ── ПЕРВИЧНЫЙ ОТБОР ── -->
              <div x-init="loadToday(p.id, j.slug, true)">
                <div class="flex items-center justify-between mb-2">
                  <div class="text-xs font-bold text-gray-700 uppercase tracking-wide">📋 Первичный отбор</div>
                  <!-- Date picker -->
                  <div class="flex items-center gap-1">
                    <template x-if="todayState[p.id+'.'+j.slug]?.dates?.length > 1">
                      <select @change="loadToday(p.id, j.slug, true, $event.target.value)" class="text-[11px] border rounded px-1.5 py-0.5">
                        <template x-for="d in todayState[p.id+'.'+j.slug].dates" :key="d">
                          <option :value="d" :selected="todayState[p.id+'.'+j.slug].currentDate===d" x-text="formatDate(d)"></option>
                        </template>
                      </select>
                    </template>
                  </div>
                </div>
                
                <template x-if="todayState[p.id+'.'+j.slug]?.cands">
                  <div>
                    <!-- Counts -->
                    <div class="flex items-center gap-3 text-xs mb-2 flex-wrap">
                      <span class="bg-green-100 text-green-700 px-1.5 py-0.5 rounded font-medium">🎯 <span x-text="todayState[p.id+'.'+j.slug].cands.target"></span> точных</span>
                      <span class="bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded font-medium">👤 <span x-text="todayState[p.id+'.'+j.slug].cands.near"></span> подходящих</span>
                      <span class="text-gray-400" x-text="'из ' + todayState[p.id+'.'+j.slug].cands.total + ' всего'"></span>
                    </div>
                    
                    <!-- Import buttons -->
                    <template x-if="routes[p.id+'.'+j.slug] && todayState[p.id+'.'+j.slug].cands.relevant > 0">
                      <div class="mb-2">
                        <div class="flex gap-1.5 flex-wrap">
                          <button x-show="todayState[p.id+'.'+j.slug].cands.target > 0" @click="importCandidates(p.id, j.slug, 'target')"
                            :disabled="todayState[p.id+'.'+j.slug]?.importing"
                            class="flex-1 min-w-0 text-[11px] font-medium py-1.5 px-2 rounded-lg bg-green-600 text-white hover:bg-green-700 disabled:opacity-50">
                            🎯 Импорт <span x-text="todayState[p.id+'.'+j.slug].cands.target"></span> точных
                          </button>
                          <button x-show="todayState[p.id+'.'+j.slug].cands.near > 0" @click="importCandidates(p.id, j.slug, 'near')"
                            :disabled="todayState[p.id+'.'+j.slug]?.importing"
                            class="flex-1 min-w-0 text-[11px] font-medium py-1.5 px-2 rounded-lg bg-blue-500 text-white hover:bg-blue-600 disabled:opacity-50">
                            👤 Импорт <span x-text="todayState[p.id+'.'+j.slug].cands.near"></span> подх.
                          </button>
                          <button @click="importCandidates(p.id, j.slug, 'all')"
                            :disabled="todayState[p.id+'.'+j.slug]?.importing"
                            class="flex-1 min-w-0 text-[11px] font-medium py-1.5 px-2 rounded-lg bg-gray-600 text-white hover:bg-gray-700 disabled:opacity-50">
                            📥 Все <span x-text="todayState[p.id+'.'+j.slug].cands.relevant"></span>
                          </button>
                        </div>
                        <div x-show="todayState[p.id+'.'+j.slug]?.importing" class="mt-1 text-xs text-gray-500">⏳ Импортирую...</div>
                        <!-- Import results -->
                        <template x-if="todayState[p.id+'.'+j.slug]?.importResults">
                          <div class="mt-2 space-y-1">
                            <div class="text-[11px] font-medium text-gray-600 mb-1" x-text="'Результат: ' + todayState[p.id+'.'+j.slug].importSummary"></div>
                            <template x-for="(ir, ii) in todayState[p.id+'.'+j.slug].importResults" :key="ii">
                              <div class="text-[11px] py-0.5 flex flex-wrap items-center gap-1">
                                <span x-text="ir.ok ? '✅' : '🔄'"></span>
                                <a x-show="ir.candidate_id" :href="'https://app.friend.work/Candidate/Profile/'+ir.candidate_id" target="_blank" class="text-blue-600 underline font-medium" x-text="'FW-'+ir.candidate_id"></a>
                                <span x-show="ir.ok" class="text-green-600">импортирован</span>
                                <span x-show="!ir.ok && ir.candidate_id" class="text-gray-500">дубликат</span>
                                <template x-if="ir.vacancies && ir.vacancies.length">
                                  <span class="text-[10px] text-purple-600 bg-purple-50 px-1 rounded" x-text="'📋 ' + ir.vacancies.join(', ')"></span>
                                </template>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>
                    
                    <!-- Candidate list (expandable) -->
                    <template x-if="todayState[p.id+'.'+j.slug].cands.total > 0">
                      <div>
                        <button @click="todayState[p.id+'.'+j.slug].open = !todayState[p.id+'.'+j.slug].open"
                          class="text-[11px] text-blue-600 hover:text-blue-800 flex items-center gap-1 mb-1">
                          <span x-text="todayState[p.id+'.'+j.slug].open ? '▼ Скрыть кандидатов' : '▶ Показать кандидатов (' + todayState[p.id+'.'+j.slug].cands.total + ')'"></span>
                        </button>
                        <div x-show="todayState[p.id+'.'+j.slug].open" x-cloak class="mt-1 space-y-1.5">
                          <!-- Target -->
                          <template x-if="todayState[p.id+'.'+j.slug].cands.target > 0">
                            <div>
                              <div class="text-[11px] font-bold text-green-700 mb-1">🎯 Точные попадания</div>
                              <template x-for="(c, ci) in todayState[p.id+'.'+j.slug].cands.candidates.filter(x=>x.relevant && x.fit_type==='target')" :key="'t'+ci">
                                <div class="bg-green-50 rounded-lg p-2.5 border border-green-200 mb-1.5">
                                  <div class="text-xs font-semibold text-green-800" x-text="(ci+1)+'. '+c.title"></div>
                                  <div class="text-[11px] text-green-700 mt-0.5">Соответствие: <b x-text="Math.round(c.confidence*100)+'%'"></b></div>
                                  <div class="text-[11px] text-green-700">🏢 <span x-text="c.last_job || '—'"></span></div>
                                  <div class="text-[11px] text-green-700">💰 <span x-text="c.salary || 'не указана'"></span></div>
                                  <div class="text-[11px] text-green-700">🔗 <a :href="c.link" target="_blank" class="text-green-800 underline">Резюме на HH</a></div>
                                  <div class="text-[10px] text-green-600 italic mt-0.5" x-text="'💬 ' + c.reason"></div>
                                </div>
                              </template>
                            </div>
                          </template>
                          <!-- Near -->
                          <template x-if="todayState[p.id+'.'+j.slug].cands.near > 0">
                            <div>
                              <div class="text-[11px] font-bold text-blue-600 mb-1 mt-2">👤 Подходящие</div>
                              <template x-for="(c, ci) in todayState[p.id+'.'+j.slug].cands.candidates.filter(x=>x.relevant && x.fit_type!=='target')" :key="'n'+ci">
                                <div class="bg-white rounded-lg p-2.5 border border-gray-200 mb-1.5">
                                  <div class="text-xs font-medium text-gray-800" x-text="(ci+1)+'. '+c.title"></div>
                                  <div class="text-[11px] text-gray-500 mt-0.5">Соответствие: <b x-text="Math.round(c.confidence*100)+'%'"></b></div>
                                  <div class="text-[11px] text-gray-500">🏢 <span x-text="c.last_job || '—'"></span></div>
                                  <div class="text-[11px] text-gray-500">💰 <span x-text="c.salary || 'не указана'"></span></div>
                                  <div class="text-[11px] text-gray-500">🔗 <a :href="c.link" target="_blank" class="text-blue-600 underline">Резюме на HH</a></div>
                                  <div class="text-[10px] text-gray-400 italic mt-0.5" x-text="'💬 ' + c.reason"></div>
                                </div>
                              </template>
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>
                <span x-show="todayState[p.id+'.'+j.slug]?.loading" class="text-xs text-gray-400">⏳</span>
                <span x-show="!todayState[p.id+'.'+j.slug]?.loading && !todayState[p.id+'.'+j.slug]?.cands" class="text-xs text-gray-400">Нет данных</span>
              </div>
              
              <!-- ── ВТОРИЧНЫЙ ОТБОР ── -->
              <div class="border-t border-gray-200 pt-3">
                <div class="flex items-center justify-between mb-2">
                  <div class="text-xs font-bold text-gray-700 uppercase tracking-wide">🤖 Вторичный отбор (AI скоринг)</div>
                </div>
                
                <!-- Scoring controls -->
                <div class="flex gap-2 items-center flex-wrap mb-2">
                  <select x-model="selectedModel" class="text-xs border rounded px-2 py-1">
                    <template x-for="m in models" :key="m.id">
                      <option :value="m.id" x-text="m.name"></option>
                    </template>
                  </select>
                  <button @click="startScoringForJob(p.id, j.slug)" 
                    :disabled="scoringRunning[p.id+'.'+j.slug]"
                    class="px-3 py-1 bg-purple-600 text-white rounded-lg text-xs font-medium disabled:opacity-50">
                    <span x-show="!scoringRunning[p.id+'.'+j.slug]">🤖 Запустить</span>
                    <span x-show="scoringRunning[p.id+'.'+j.slug]" x-text="'⏳ ' + (scoringProg[p.id+'.'+j.slug]||'')"></span>
                  </button>
                </div>
                
                <!-- Scoring results -->
                <template x-if="scoringRes[p.id+'.'+j.slug]?.length">
                  <div>
                    <!-- Filters -->
                    <div class="flex gap-1.5 mb-2 flex-wrap">
                      <button @click="scoringFilter[p.id+'.'+j.slug]='all'" class="px-2 py-0.5 rounded-full text-[11px]"
                        :class="(scoringFilter[p.id+'.'+j.slug]||'all')==='all'?'bg-gray-800 text-white':'bg-gray-100'">Все</button>
                      <button @click="scoringFilter[p.id+'.'+j.slug]='approved'" class="px-2 py-0.5 rounded-full text-[11px]"
                        :class="scoringFilter[p.id+'.'+j.slug]==='approved'?'bg-green-600 text-white':'bg-gray-100'">✅ Одобрен</button>
                      <button @click="scoringFilter[p.id+'.'+j.slug]='reviewed'" class="px-2 py-0.5 rounded-full text-[11px]"
                        :class="scoringFilter[p.id+'.'+j.slug]==='reviewed'?'bg-yellow-500 text-white':'bg-gray-100'">👁 Просмотрен</button>
                      <button @click="scoringFilter[p.id+'.'+j.slug]='rejected'" class="px-2 py-0.5 rounded-full text-[11px]"
                        :class="scoringFilter[p.id+'.'+j.slug]==='rejected'?'bg-red-600 text-white':'bg-gray-100'">❌ Отказ</button>
                    </div>
                    <!-- Result cards -->
                    <div class="space-y-1.5">
                      <template x-for="r in filterScoring(p.id, j.slug)" :key="r.candidateId">
                        <div class="border rounded-lg p-2.5" 
                          :class="r.fw_status==='Одобрен ИИ'?'border-green-200 bg-green-50':r.fw_status==='Отказ ИИ'?'border-red-200 bg-red-50':r.fw_status==='Просмотрен ИИ'?'border-yellow-200 bg-yellow-50':'border-gray-200'">
                          <div class="flex items-center justify-between">
                            <div>
                              <span class="font-medium text-xs" x-text="r.candidateName || 'CID-'+r.candidateId"></span>
                              <a :href="'https://app.friend.work/Candidate/Profile/'+r.candidateId" target="_blank" class="text-[10px] text-blue-500 ml-1">↗FW</a>
                            </div>
                            <div class="flex items-center gap-1.5">
                              <span class="text-[10px] px-1.5 py-0.5 rounded-full font-medium"
                                :class="r.fw_status==='Одобрен ИИ'?'bg-green-200 text-green-800':r.fw_status==='Отказ ИИ'?'bg-red-200 text-red-800':r.fw_status==='Просмотрен ИИ'?'bg-yellow-200 text-yellow-800':'bg-gray-200 text-gray-600'"
                                x-text="r.fw_status"></span>
                              <span class="text-sm font-bold" :class="r.score>=7?'text-green-600':r.score>=4?'text-yellow-600':'text-red-500'" x-text="r.score+'/10'"></span>
                            </div>
                          </div>
                          <p class="text-[10px] text-gray-500 mt-1" x-text="r.reason"></p>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
                <div x-show="!scoringRes[p.id+'.'+j.slug]?.length && !scoringRunning[p.id+'.'+j.slug]" class="text-xs text-gray-400">
                  Нажмите «Запустить» для AI-скоринга импортированных кандидатов
                </div>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>
</div>

<!-- ═══ SETTINGS ═══ -->
<div x-show="tab==='settings'" x-cloak>
  <!-- Model & thresholds -->
  <div class="bg-white rounded-xl shadow-sm p-4 mb-4">
    <h3 class="font-semibold text-gray-700 mb-3">Модель и пороги</h3>
    <div class="space-y-3">
      <div>
        <label class="text-xs text-gray-500">Модель по умолчанию:</label>
        <select x-model="config.default_model" @change="saveConfig()" class="w-full border rounded-lg px-3 py-2 text-sm mt-1">
          <template x-for="m in models" :key="m.id">
            <option :value="m.id" x-text="m.name + ' — ' + m.price"></option>
          </template>
        </select>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs text-gray-500">Порог одобрения (≥)</label>
          <input type="number" x-model.number="config.score_threshold_approve" @change="saveConfig()" min="1" max="10" class="w-full border rounded-lg px-3 py-2 text-sm mt-1">
        </div>
        <div>
          <label class="text-xs text-gray-500">Порог отказа (&lt;)</label>
          <input type="number" x-model.number="config.score_threshold_reject" @change="saveConfig()" min="1" max="10" class="w-full border rounded-lg px-3 py-2 text-sm mt-1">
        </div>
      </div>
      <div class="text-xs text-gray-400 bg-gray-50 rounded p-2">
        Оценка ≥ <span x-text="config.score_threshold_approve"></span> → ✅ Одобрен ИИ · 
        Оценка <span x-text="config.score_threshold_reject"></span>-<span x-text="config.score_threshold_approve - 1"></span> → 👁 Просмотрен ИИ ·
        Оценка &lt; <span x-text="config.score_threshold_reject"></span> → ❌ Отказ ИИ
      </div>
    </div>
  </div>
  
  <!-- Prompt editor -->
  <div class="bg-white rounded-xl shadow-sm p-4 mb-4">
    <h3 class="font-semibold text-gray-700 mb-3">Промпты скоринга</h3>
    <div class="flex gap-2 mb-2 flex-wrap">
      <template x-for="p in prompts" :key="p.name">
        <button @click="loadPrompt(p.name)" class="px-3 py-1 rounded-full text-xs font-medium"
          :class="currentPrompt===p.name?'bg-blue-600 text-white':'bg-gray-100 text-gray-600'"
          x-text="p.name"></button>
      </template>
    </div>
    <textarea x-model="promptText" class="w-full border rounded-lg px-3 py-2 text-xs font-mono h-48 resize-y"></textarea>
    <div class="flex gap-2 mt-2">
      <button @click="savePrompt()" class="px-4 py-1.5 bg-blue-600 text-white rounded-lg text-sm">💾 Сохранить</button>
      <button @click="newPrompt()" class="px-4 py-1.5 bg-gray-200 text-gray-700 rounded-lg text-sm">➕ Новый промпт</button>
    </div>
  </div>
</div>

</main>

<script>
function panel() {
  const KEY = new URLSearchParams(location.search).get('key') || '';
  const BASE = location.pathname.replace(/\/$/, '');
  const API = (path) => BASE + path + (path.includes('?') ? '&' : '?') + 'key=' + KEY;
  
  return {
    tab: 'dashboard',
    lastUpdate: '',
    dashboard: [],
    profiles: [],
    vacancies: [],
    routes: {},
    todayState: {},
    // Scoring (per job)
    selectedModel: 'gpt-5.2',
    models: [],
    scoringRunning: {},
    scoringProg: {},
    scoringRes: {},
    scoringFilter: {},
    // Settings
    config: {},
    prompts: [],
    currentPrompt: '',
    promptText: '',
    
    async init() {
      this.lastUpdate = new Date().toLocaleTimeString('ru-RU');
      const [dash, ctrl, vacs, cfg, mdls, prm, rts] = await Promise.allSettled([
        fetch(API('/api/dashboard')).then(r=>r.json()),
        fetch(API('/api/controls')).then(r=>r.json()),
        fetch(API('/api/vacancies')).then(r=>r.json()),
        fetch(API('/api/config')).then(r=>r.json()),
        fetch(API('/api/models')).then(r=>r.json()),
        fetch(API('/api/prompts')).then(r=>r.json()),
        fetch(API('/api/routes')).then(r=>r.json()),
      ]);
      if (dash.status==='fulfilled') this.dashboard = dash.value.stats || [];
      if (ctrl.status==='fulfilled') this.profiles = ctrl.value.profiles || [];
      if (vacs.status==='fulfilled') this.vacancies = vacs.value.vacancies || [];
      if (cfg.status==='fulfilled') { this.config = cfg.value; this.selectedModel = cfg.value.default_model || 'gpt-5.2'; }
      if (mdls.status==='fulfilled') this.models = mdls.value.models || [];
      if (prm.status==='fulfilled') this.prompts = prm.value.prompts || [];
      if (rts.status==='fulfilled') this.routes = rts.value.routes || {};
    },
    
    formatDate(d) {
      if (!d) return '';
      const today = new Date().toISOString().slice(0,10);
      const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
      if (d === today) return 'Сегодня';
      if (d === yesterday) return 'Вчера';
      return d.slice(5); // MM-DD
    },
    
    getRoutePrompt(profileId, jobSlug) {
      return (this.config.route_prompts || {})[profileId + '.' + jobSlug] || this.prompts[0]?.name || 'default_am';
    },
    
    async setRoutePrompt(profileId, jobSlug, field, value) {
      if (!this.config.route_prompts) this.config.route_prompts = {};
      this.config.route_prompts[profileId + '.' + jobSlug] = value;
      await fetch(API('/api/config'), {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(this.config)});
    },
    
    async toggle(profileId, field) {
      const r = await fetch(API('/api/controls/toggle'), {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({profile: profileId, field})});
      if (r.ok) {
        const d = await fetch(API('/api/controls')).then(r=>r.json());
        this.profiles = d.profiles || [];
      }
    },
    
    async setRoute(key, vacancyId) {
      this.routes[key] = vacancyId ? parseInt(vacancyId) : null;
      await fetch(API('/api/routes'), {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({routes: this.routes})});
    },
    
    async loadToday(profileId, jobSlug, silent, date) {
      const k = profileId + '.' + jobSlug;
      if (!this.todayState[k]) this.todayState[k] = {open: false, cands: null, loading: false, importing: false, importResults: null, dates: [], currentDate: ''};
      const st = this.todayState[k];
      st.loading = true;
      const dateParam = date ? '&date=' + date : '';
      try {
        const d = await fetch(API('/api/today/' + profileId + '/' + jobSlug) + dateParam).then(r => r.json());
        st.cands = d;
        st.dates = d.dates || [];
        st.currentDate = d.date || '';
      } catch(e) { console.error(e); }
      st.loading = false;
    },
    
    async importCandidates(profileId, jobSlug, filter) {
      const k = profileId + '.' + jobSlug;
      const st = this.todayState[k];
      const vacancyId = this.routes[k];
      if (!st?.cands || !vacancyId) return;
      st.importing = true;
      st.importResults = null;
      st.importSummary = null;
      let filtered = st.cands.candidates.filter(c => c.relevant);
      if (filter === 'target') filtered = filtered.filter(c => c.fit_type === 'target');
      else if (filter === 'near') filtered = filtered.filter(c => c.fit_type !== 'target');
      const links = filtered.map(c => c.link);
      const label = filter === 'target' ? 'точных' : filter === 'near' ? 'подходящих' : 'всех';
      try {
        const r = await fetch(API('/api/import'), {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({vacancy_id: parseInt(vacancyId), links})
        });
        const d = await r.json();
        st.importResults = d.results || [];
        st.importSummary = `${label}: ✅ ${d.imported} новых · 🔄 ${d.duplicates} дубл. · ${d.total} всего`;
      } catch(e) {
        st.importResults = [{ok: false, message: e.message}];
        st.importSummary = '❌ Ошибка';
      }
      st.importing = false;
    },
    
    async startScoringForJob(profileId, jobSlug) {
      const k = profileId + '.' + jobSlug;
      const vacancyId = this.routes[k];
      if (!vacancyId) { alert('Сначала привяжите вакансию FriendWork'); return; }
      
      this.scoringRunning[k] = true;
      this.scoringProg[k] = '0/...';
      this.scoringRes[k] = [];
      
      const prompt = this.getRoutePrompt(profileId, jobSlug);
      
      await fetch(API('/api/scoring/' + vacancyId + '/start'), {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({model: this.selectedModel, prompt: prompt})
      });
      
      const es = new EventSource(API('/api/scoring/' + vacancyId + '/stream'));
      es.addEventListener('update', (e) => {
        const data = JSON.parse(e.data);
        this.scoringProg[k] = (data.progress||0) + '/' + (data.total||0);
        if (data.results) this.scoringRes[k] = data.results;
        if (data.status === 'done' || data.status === 'error') {
          this.scoringRunning[k] = false;
          es.close();
        }
      });
    },
    
    filterScoring(profileId, jobSlug) {
      const k = profileId + '.' + jobSlug;
      const f = this.scoringFilter[k] || 'all';
      const res = this.scoringRes[k] || [];
      if (f === 'all') return res;
      if (f === 'approved') return res.filter(r => r.fw_status === 'Одобрен ИИ');
      if (f === 'reviewed') return res.filter(r => r.fw_status === 'Просмотрен ИИ');
      if (f === 'rejected') return res.filter(r => r.fw_status === 'Отказ ИИ');
      return res;
    },
    
    async saveConfig() {
      await fetch(API('/api/config'), {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(this.config)});
    },
    
    async loadPrompt(name) {
      this.currentPrompt = name;
      const d = await fetch(API('/api/prompt/' + name)).then(r=>r.json());
      this.promptText = d.content || '';
    },
    
    async savePrompt() {
      if (!this.currentPrompt) return;
      await fetch(API('/api/prompt/' + this.currentPrompt), {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({content: this.promptText})});
      alert('Сохранено!');
    },
    
    async newPrompt() {
      const name = prompt('Имя нового промпта (латиница, без пробелов):');
      if (!name || !/^[a-z0-9_-]+$/i.test(name)) return;
      this.currentPrompt = name;
      this.promptText = '';
      await fetch(API('/api/prompt/' + name), {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({content: ''})});
      const prm = await fetch(API('/api/prompts')).then(r=>r.json());
      this.prompts = prm.prompts || [];
    }
  }
}
</script>
</body>
</html>
