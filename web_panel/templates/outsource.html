<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Radar — Аутсорсинг</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="outsourceApp()">

  {% include 'nav.html' %}

  <!-- Page header -->
  <div class="bg-white border-b">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <h2 class="text-base font-semibold text-gray-700">🏢 Автопоиски — Аутсорсинг</h2>
      <span class="text-xs text-gray-400" x-text="companies.filter(c=>c.enabled).length + '/' + companies.length + ' вкл.'"></span>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-4 py-6 space-y-6">

    <!-- Stats bar -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white rounded-xl shadow-sm p-4 text-center">
        <div class="text-2xl font-bold text-blue-600" x-text="companies.length">0</div>
        <div class="text-xs text-gray-500">Компаний</div>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-4 text-center">
        <div class="text-2xl font-bold text-green-600" x-text="companies.filter(c=>c.enabled).length">0</div>
        <div class="text-xs text-gray-500">Включено</div>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-4 text-center">
        <div class="text-2xl font-bold text-purple-600" x-text="totalResumes">0</div>
        <div class="text-xs text-gray-500">Резюме найдено</div>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-4 text-center">
        <div class="text-2xl font-bold text-orange-600" x-text="scoredCount">—</div>
        <div class="text-xs text-gray-500">Оценено</div>
      </div>
    </div>

    <!-- Actions -->
    <div class="bg-white rounded-xl shadow-sm p-4 flex flex-wrap items-center gap-3">
      <button @click="checkAllCounts()" :disabled="checking" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 disabled:opacity-50 transition-colors">
        <span x-show="!checking">🔍 Проверить все</span>
        <span x-show="checking" x-text="'⏳ Проверяю... '+checkProgress+'/'+companies.filter(c=>c.enabled).length"></span>
      </button>
      <button @click="runSearch()" :disabled="running" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm font-medium hover:bg-green-700 disabled:opacity-50 transition-colors">
        <span x-show="!running">🚀 Запустить поиск + скоринг</span>
        <span x-show="running">⏳ Идёт поиск...</span>
      </button>
      <button @click="showAddForm = !showAddForm" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200 transition-colors">
        ➕ Добавить компанию
      </button>
      <button @click="toggleAll()" class="px-3 py-2 bg-gray-100 text-gray-600 rounded-lg text-xs font-medium hover:bg-gray-200 transition-colors">
        ⚡ Вкл/выкл все
      </button>
    </div>

    <!-- Add company form -->
    <div x-show="showAddForm" x-transition class="bg-white rounded-xl shadow-sm p-4 space-y-3">
      <h3 class="font-semibold text-gray-700">Добавить компанию</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <input x-model="newCompany.name" placeholder="Название" class="border rounded-lg px-3 py-2 text-sm">
        <input x-model="newCompany.inn" placeholder="ИНН" class="border rounded-lg px-3 py-2 text-sm">
        <input x-model="newCompany.site" placeholder="Сайт" class="border rounded-lg px-3 py-2 text-sm">
      </div>
      <input x-model="newCompany.hh_key" placeholder='HH-ключ (WORKPLACES:("ООО Пример"))' class="border rounded-lg px-3 py-2 text-sm w-full">
      <input x-model="newCompany.directions" placeholder="Направления (курьеры, склад и т.д.)" class="border rounded-lg px-3 py-2 text-sm w-full">
      <div class="flex gap-2">
        <button @click="addCompany()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700">Добавить</button>
        <button @click="showAddForm=false" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200">Отмена</button>
      </div>
    </div>

    <!-- Search progress -->
    <div x-show="running" class="bg-blue-50 rounded-xl p-4">
      <div class="flex items-center gap-2 mb-2">
        <div class="animate-spin h-4 w-4 border-2 border-blue-600 border-t-transparent rounded-full"></div>
        <span class="text-sm font-medium text-blue-800" x-text="runStatus"></span>
      </div>
      <div class="bg-blue-200 rounded-full h-2">
        <div class="bg-blue-600 rounded-full h-2 transition-all" :style="'width:'+runProgress+'%'"></div>
      </div>
      <div class="mt-2 text-xs text-blue-600 max-h-32 overflow-y-auto" x-html="runLog"></div>
    </div>

    <!-- Companies table -->
    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-gray-600 text-xs uppercase">
          <tr>
            <th class="px-3 py-2 text-left w-8">Вкл</th>
            <th class="px-3 py-2 text-left">Компания</th>
            <th class="px-3 py-2 text-left hidden md:table-cell">ИНН</th>
            <th class="px-3 py-2 text-left hidden lg:table-cell">Направления</th>
            <th class="px-3 py-2 text-center">Резюме</th>
            <th class="px-3 py-2 text-center">Статус</th>
            <th class="px-3 py-2 text-center">Действия</th>
          </tr>
        </thead>
        <tbody class="divide-y">
          <template x-for="(comp, idx) in companies" :key="idx">
            <tr :class="comp.enabled ? 'bg-white' : 'bg-gray-50 opacity-60'">
              <td class="px-3 py-2">
                <input type="checkbox" x-model="comp.enabled" @change="saveCompanies()" class="rounded">
              </td>
              <td class="px-3 py-2">
                <div class="font-medium text-gray-800" x-text="comp.name"></div>
                <div class="text-xs text-gray-400 truncate max-w-xs" x-text="comp.hh_key?.substring(0,60)+'...'"></div>
              </td>
              <td class="px-3 py-2 text-xs text-gray-500 hidden md:table-cell" x-text="comp.inn || '—'"></td>
              <td class="px-3 py-2 text-xs text-gray-500 hidden lg:table-cell" x-text="comp.directions || '—'"></td>
              <td class="px-3 py-2 text-center">
                <span x-show="comp.last_count !== null && comp.last_count !== undefined" class="font-mono font-medium"
                      :class="comp.last_count > 1000 ? 'text-red-600' : comp.last_count > 500 ? 'text-yellow-600' : comp.last_count > 0 ? 'text-green-600' : 'text-gray-400'"
                      x-text="comp.last_count"></span>
                <span x-show="comp.last_count === null || comp.last_count === undefined" class="text-gray-300">—</span>
              </td>
              <td class="px-3 py-2 text-center">
                <span x-show="comp.checking" class="animate-spin inline-block">⏳</span>
                <span x-show="!comp.checking && comp.last_count > 1000" class="text-red-500 text-xs">🔴 шумно</span>
                <span x-show="!comp.checking && comp.last_count !== null && comp.last_count <= 1000 && comp.last_count > 500" class="text-yellow-500 text-xs">🟡 много</span>
                <span x-show="!comp.checking && comp.last_count !== null && comp.last_count <= 500 && comp.last_count > 10" class="text-green-500 text-xs">🟢 ок</span>
                <span x-show="!comp.checking && comp.last_count !== null && comp.last_count <= 10 && comp.last_count > 0" class="text-blue-500 text-xs">🔵 мало</span>
                <span x-show="!comp.checking && comp.last_count === 0" class="text-gray-400 text-xs">⚪ пусто</span>
              </td>
              <td class="px-3 py-2 text-center">
                <div class="flex gap-1 justify-center">
                  <button @click="checkOne(idx)" :disabled="comp.checking" class="px-2 py-1 bg-blue-50 text-blue-600 rounded text-xs hover:bg-blue-100 disabled:opacity-50">🔍</button>
                  <button @click="editCompany(idx)" class="px-2 py-1 bg-gray-50 text-gray-600 rounded text-xs hover:bg-gray-100">✏️</button>
                  <button @click="removeCompany(idx)" class="px-2 py-1 bg-red-50 text-red-600 rounded text-xs hover:bg-red-100">🗑️</button>
                </div>
              </td>
            </tr>
          </template>
        </tbody>
        <tfoot class="bg-gray-100 border-t-2 border-gray-300">
          <tr class="font-semibold text-gray-700">
            <td class="px-3 py-3"></td>
            <td class="px-3 py-3">Итого</td>
            <td class="px-3 py-3 hidden md:table-cell"></td>
            <td class="px-3 py-3 hidden lg:table-cell"></td>
            <td class="px-3 py-3 text-center font-mono" x-text="companies.reduce((s,c) => s + (c.last_count || 0), 0)"></td>
            <td class="px-3 py-3"></td>
            <td class="px-3 py-3"></td>
          </tr>
        </tfoot>
      </table>
    </div>

    <!-- Edit modal -->
    <div x-show="editIdx !== null" x-transition class="fixed inset-0 bg-black/30 flex items-center justify-center z-50" @click.self="editIdx=null">
      <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-lg mx-4 space-y-3">
        <h3 class="font-semibold text-gray-700">Редактировать компанию</h3>
        <template x-if="editIdx !== null">
          <div class="space-y-3">
            <input x-model="companies[editIdx].name" placeholder="Название" class="border rounded-lg px-3 py-2 text-sm w-full">
            <input x-model="companies[editIdx].inn" placeholder="ИНН" class="border rounded-lg px-3 py-2 text-sm w-full">
            <input x-model="companies[editIdx].site" placeholder="Сайт" class="border rounded-lg px-3 py-2 text-sm w-full">
            <textarea x-model="companies[editIdx].hh_key" placeholder="HH-ключ" class="border rounded-lg px-3 py-2 text-sm w-full h-24 font-mono text-xs"></textarea>
            <input x-model="companies[editIdx].directions" placeholder="Направления" class="border rounded-lg px-3 py-2 text-sm w-full">
            <div class="flex gap-2">
              <button @click="saveCompanies(); editIdx=null" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium">Сохранить</button>
              <button @click="editIdx=null" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium">Отмена</button>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>

<script>
function outsourceApp() {
  const key = new URLSearchParams(window.location.search).get('key') || '';
  return {
    key,
    companies: [],
    checking: false,
    checkProgress: 0,
    running: false,
    runStatus: '',
    runProgress: 0,
    runLog: '',
    showAddForm: false,
    editIdx: null,
    scoredCount: '—',
    newCompany: { name: '', inn: '', site: '', hh_key: '', directions: '' },

    get totalResumes() {
      return this.companies.reduce((s, c) => s + (c.last_count || 0), 0);
    },

    async init() {
      await this.loadCompanies();
      await this.loadStats();
    },

    async loadCompanies() {
      const r = await fetch(`/api/outsource/companies?key=${this.key}`);
      if (r.ok) this.companies = await r.json();
    },

    async loadStats() {
      try {
        const r = await fetch(`/api/outsource/stats?key=${this.key}`);
        if (r.ok) {
          const d = await r.json();
          this.scoredCount = d.scored || '—';
        }
      } catch(e) {}
    },

    async saveCompanies() {
      await fetch(`/api/outsource/companies?key=${this.key}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(this.companies)
      });
    },

    async checkOne(idx) {
      this.companies[idx].checking = true;
      try {
        const r = await fetch(`/api/outsource/check?key=${this.key}&idx=${idx}`);
        if (r.ok) {
          const d = await r.json();
          this.companies[idx].last_count = d.count;
        }
      } catch(e) {}
      this.companies[idx].checking = false;
    },

    async checkAllCounts() {
      this.checking = true;
      this.checkProgress = 0;
      const enabled = this.companies.filter(c => c.enabled);
      for (let i = 0; i < this.companies.length; i++) {
        if (!this.companies[i].enabled) continue;
        await this.checkOne(i);
        this.checkProgress++;
        await new Promise(r => setTimeout(r, 200));
      }
      this.checking = false;
      await this.saveCompanies();
    },

    async addCompany() {
      if (!this.newCompany.name || !this.newCompany.hh_key) return;
      this.companies.push({
        ...this.newCompany,
        brand: this.newCompany.name,
        city: '',
        enabled: true,
        last_count: null,
      });
      await this.saveCompanies();
      this.newCompany = { name: '', inn: '', site: '', hh_key: '', directions: '' };
      this.showAddForm = false;
    },

    editCompany(idx) {
      this.editIdx = idx;
    },

    async removeCompany(idx) {
      if (!confirm(`Удалить ${this.companies[idx].name}?`)) return;
      this.companies.splice(idx, 1);
      await this.saveCompanies();
    },

    toggleAll() {
      const allEnabled = this.companies.every(c => c.enabled);
      this.companies.forEach(c => c.enabled = !allEnabled);
      this.saveCompanies();
    },

    async runSearch() {
      if (!confirm('Запустить поиск и скоринг по всем включённым компаниям?')) return;
      this.running = true;
      this.runStatus = 'Запуск...';
      this.runProgress = 0;
      this.runLog = '';

      try {
        const r = await fetch(`/api/outsource/run?key=${this.key}`, { method: 'POST' });
        const data = await r.json();
        const taskId = data.task_id;

        // Listen to SSE
        const es = new EventSource(`/api/outsource/run/${taskId}/stream?key=${this.key}`);
        es.onmessage = (e) => {
          const d = JSON.parse(e.data);
          if (d.stage === 'progress') {
            this.runStatus = d.message || 'Идёт...';
            this.runProgress = d.progress || 0;
            this.runLog += `<div>${d.message}</div>`;
          } else if (d.stage === 'done') {
            this.runStatus = 'Готово!';
            this.runProgress = 100;
            this.running = false;
            this.loadStats();
            es.close();
          } else if (d.stage === 'error') {
            this.runStatus = 'Ошибка: ' + d.message;
            this.running = false;
            es.close();
          }
        };
        es.onerror = () => {
          this.running = false;
          es.close();
        };
      } catch(e) {
        this.runStatus = 'Ошибка запуска';
        this.running = false;
      }
    },
  };
}
</script>
</body>
</html>
