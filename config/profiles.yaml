profiles:
  event_agencies:
    name: "Event агентства"
    description: "Поиск кандидатов для event-агентств"
    source: "hh_api"
    hh_companies_file: "event_companies.json"
    # IMAP config (legacy, switched to HH API 2026-03-10):
    # imap:
    #   host: "imap.yandex.ru"
    #   port: 993
    #   user: "hr11@btl-agency.ru"
    #   pass_env: "IMAP_PASS"
    telegram:
      bot_token_env: "TELEGRAM_BOT_TOKEN"
      chat_id_env: "TELEGRAM_CHAT_ID"
    jobs:
      - name: "Account Director"
        slug: "account_director"
        prompt_file: "account_director.txt"
        emoji: "🎯"
        description: "Руководитель отдела BTL / Group Head / Account Director"
        
      - name: "Account Manager"  
        slug: "account_manager"
        prompt_file: "account_manager.txt"
        emoji: "👔"
        description: "Account Manager / Client Manager"
        
      - name: "Project Manager"
        slug: "project_manager"
        prompt_file: "project_manager.txt"
        emoji: "📋"
        description: "Project Manager / Руководитель проектов"

      - name: "New Business Director"
        slug: "new_business"
        prompt_file: "new_business.txt"
        emoji: "💼"
        description: "New Business Director / Manager — привлечение клиентов, работа с входящими лидами, брифами"
        
  btl_agencies:
    name: "BTL агентства"
    description: "Поиск кандидатов для BTL-агентств"
    source: "hh_api"
    hh_companies_file: "btl_companies.json"
    # Legacy IMAP config (kept for reference)
    # imap:
    #   host: "imap.yandex.ru"
    #   port: 993
    #   user: "hrcp@btl-agency.ru"
    #   pass_env: "IMAP_BTL_PASS"
    telegram:
      bot_token_env: "TELEGRAM_BOT_TOKEN"
      chat_id_env: "TELEGRAM_CHAT_ID"
    jobs:
      - name: "Account Director"
        slug: "account_director"
        prompt_file: "account_director.txt"
        emoji: "🎯"
        description: "Руководитель клиентского направления / Group Head / Account Director (BTL)"

      - name: "Account Manager"
        slug: "account_manager"
        prompt_file: "account_manager.txt"
        emoji: "👔"
        description: "Account Manager / Client Manager"

      - name: "Project Manager"
        slug: "project_manager"
        prompt_file: "project_manager.txt"
        emoji: "📋"
        description: "Project Manager / Руководитель проектов (с потенциалом в аккаунты)"

      - name: "New Business Director"
        slug: "new_business"
        prompt_file: "new_business.txt"
        emoji: "💼"
        description: "New Business Director / Manager — привлечение клиентов, работа с входящими лидами, брифами"

  outsource_agencies:
    name: "Аутсорсинг"
    description: "Поиск руководителей для аутсорсинговых компаний"
    source: "hh_api"
    hh_companies_file: "outsource_companies.json"
    telegram:
      bot_token_env: "TELEGRAM_BOT_TOKEN"
      chat_id_env: "TELEGRAM_CHAT_ID"
    jobs:
      - name: "Руководитель аутсорсинга"
        slug: "outsource_manager"
        prompt_file: "outsource_manager.txt"
        emoji: "🏭"
        description: "Руководитель отдела аутсорсинга / аутстаффинга персонала"

# Общие настройки
common:
  openai:
    api_key_env: "OPENAI_API_KEY"
    model: "gpt-4o"
    batch_size: 15
    timeout: 60
    temperature: 0.1
  
  schedule:
    event_agencies: "09:00"  # UTC
    btl_agencies: "09:30"   # UTC
    
  database:
    base_path: "data"
    suffix: ".db"